<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>โปรไฟล์ — EXION Expense</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B7081D">
  <style>
    /* ═══ 🎯 v9.6 แถบ 4 ขั้นของรอบเบิก — เห็นชัดว่าอยู่ขั้นไหน สีเปลี่ยนตามขั้น ═══ */
    .xsteps { display: flex; gap: 6px; margin: 0 0 10px; }
    .xsteps .st { flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: var(--gray-400); }
    .xsteps .st i { display: block; height: 6px; border-radius: 3px; background: var(--gray-200); margin-bottom: 5px; }
    .xsteps .st.done { color: #166534; } .xsteps .st.done i { background: #16A34A; }
    .xsteps .st.cur { color: var(--gray-900); } .xsteps .st.cur i { background: #F59E0B; }
    .xsteps .st.cur.blue { color: #1E3A8A; } .xsteps .st.cur.blue i { background: #2563EB; }
    .xsteps .st.cur.green { color: #166534; } .xsteps .st.cur.green i { background: #16A34A; }
    .xbox { border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; border: 1.5px solid; }
    .xbox .h { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .xbox .d { font-size: 12.5px; margin-top: 4px; line-height: 1.5; }
    .xbox.gray { background: var(--gray-50); border-color: var(--gray-200); color: var(--gray-700); }
    .xbox.amber { background: linear-gradient(180deg,#FFFBEB,#FEF3C7); border-color: #F59E0B; color: #78350F; }
    .xbox.blue { background: linear-gradient(180deg,#EFF6FF,#DBEAFE); border-color: #2563EB; color: #1E3A8A; }
    .xbox.green { background: linear-gradient(180deg,#F0FDF4,#DCFCE7); border-color: #16A34A; color: #14532D; }
    .xbox.red { background: #FEF2F2; border-color: #DC2626; color: #7F1D1D; }
    .xbox .pulse { width: 10px; height: 10px; border-radius: 50%; background: currentColor; animation: xp 1.2s ease-in-out infinite; }
    @keyframes xp { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  </style>
</head>
<body>
  <div class="header">
    <button class="back" aria-label="ย้อนกลับ" onclick="location.href = getApp() === 'petty' ? 'pc-home.html' : 'index.html'" id="backBtn"></button>
    <h1><img src="icons/logo.png" alt="EXION" class="logo"><span style="font-size:13px;font-weight:700;margin-left:6px;">โปรไฟล์</span></h1>
  </div>

  <div class="container">
    <div class="hero" style="text-align:center;">
      <div class="avatar-xl" id="avatar">?</div>
      <div class="hero-name" id="userName">-</div>
      <div class="hero-sub" id="userPosition">-</div>
      <div class="hero-sub" id="userEmail" style="opacity:.72;font-size:12px;">-</div>
      <span class="role-badge" id="userDept">-</span>
    </div>

    <!-- Monthly Export -->
    <div class="card">
      <div class="card-head"><span class="ib ib-green">📊</span>
        <div><div class="ch-title">Export ใบเบิกรายเดือน</div>
        <div class="ch-sub">ขออนุมัติ 1 ครั้ง แล้วดาวน์โหลด Excel ตัวจริงได้เลย</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">
        <div class="field" style="margin:0;"><label>เดือน</label><select id="exportMonth"></select></div>
        <div class="field" style="margin:0;"><label>ปี</label><select id="exportYear"></select></div>
      </div>
      <div id="cutoffWrap" style="margin-top:12px;display:none;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="field" style="margin:0;"><label>ตั้งแต่วันที่</label><input type="date" id="cutoffStart"></div>
          <div class="field" style="margin:0;"><label>ถึงวันที่</label><input type="date" id="cutoffEnd"></div>
        </div>
        <div class="hint" id="cutoffHint" style="margin-top:6px;">—</div>
        <div id="cutoffWarn" style="margin-top:8px;"></div>
        <!-- โชว์สดๆ ว่าไฟล์ที่จะได้ครอบคลุมช่วงไหน กี่รายการ — จะได้เห็นก่อนกด ไม่ต้องดาวน์โหลดมาเดา -->
        <div id="rangePreview" class="info-box" style="margin-top:8px;font-size:12.5px;display:none;"></div>
      </div>
      <div id="exportStatusBox" style="margin-top:14px;"><div class="loading" style="padding:20px;"><div class="spinner"></div></div></div>
      <div id="exportActions" style="display:grid;gap:9px;margin-top:12px;"></div>
    </div>

    <!-- Signature -->
    <div class="card">
      <div class="card-head"><span class="ib ib-purple">✍️</span>
        <div><div class="ch-title">ลายเซ็นของฉัน</div>
        <div class="ch-sub">เซ็น 1 ครั้ง — ใช้อัตโนมัติทุกครั้งที่อนุมัติ</div></div>
      </div>

      <div id="currentSigWrap" class="saved-sig" style="display:none;">
        <div class="ss-label">✅ ลายเซ็นที่บันทึกไว้</div>
        <img id="currentSig" alt="signature">
      </div>

      <div class="sig-canvas-wrap">
        <canvas id="sigCanvas" class="sig-canvas"></canvas>
        <span id="sigPlaceholder" class="sig-ph">✍️ เซ็นที่นี่ด้วยนิ้ว / เมาส์</span>
      </div>

      <label for="sigUpload" class="upload-area" style="padding:14px;margin-top:10px;">
        <input type="file" id="sigUpload" accept="image/png,image/jpeg">
        <div class="icon-wrap">📷</div>
        <div class="text">อัปโหลดรูปลายเซ็นแทน</div>
        <div class="sub">PNG พื้นหลังใสจะสวยที่สุด · ไม่เกิน 2 MB</div>
      </label>

      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-secondary" id="clearSigBtn" style="flex:1;">🗑 ล้าง</button>
        <button class="btn btn-primary" id="saveSigBtn" style="flex:1.4;">💾 บันทึกลายเซ็น</button>
      </div>
    </div>

    <!-- Account -->
    <div class="card">
      <div class="card-head"><span class="ib ib-blue">⚙️</span><div><div class="ch-title">บัญชี</div></div></div>
      <div style="display:grid;gap:9px;margin-top:12px;">
        <button class="btn btn-secondary" onclick="location.href='reset-password.html'">🔑 เปลี่ยน / รีเซ็ตรหัสผ่าน</button>
        <button class="btn btn-danger" id="logoutBtn">🚪 ออกจากระบบ</button>
      </div>
    </div>

    <p class="footnote">EXION Expense v6.0 · EXION (Thailand) Co., Ltd.</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireLogin();
    let myExports = [], sigPad = null;
    const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

    function init() {
      const bb = document.getElementById('backBtn');
      if (bb && typeof icon === 'function') bb.innerHTML = icon('back');
      document.getElementById('avatar').textContent = (session.Name||'?').trim().charAt(0).toUpperCase();
      document.getElementById('userName').textContent = session.Name || '-';
      document.getElementById('userPosition').textContent = session.Position || '-';
      document.getElementById('userEmail').textContent = session.Email || '-';
      document.getElementById('userDept').textContent = session.Department || '-';

      const mSel = document.getElementById('exportMonth'), ySel = document.getElementById('exportYear');
      const now = new Date();
      MONTHS.forEach((m,i) => { const o=document.createElement('option'); o.value=i+1; o.textContent=m; if(i+1===now.getMonth()+1) o.selected=true; mSel.appendChild(o); });
      for (let y = now.getFullYear(); y >= now.getFullYear()-3; y--) { const o=document.createElement('option'); o.value=y; o.textContent=y; if(y===now.getFullYear()) o.selected=true; ySel.appendChild(o); }
      mSel.addEventListener('change', refreshExportStatus);
      ySel.addEventListener('change', refreshExportStatus);
      document.getElementById('logoutBtn').addEventListener('click', () => {
        if (confirm('ออกจากระบบ?')) { clearSession(); location.href = 'index.html'; }
      });
    }

    async function loadMyExports() {
      try { const r = await apiGet('getMyExportRequests', { email: session.Email }); myExports = Array.isArray(r) ? r : []; }
      catch { myExports = []; }
      refreshExportStatus();
    }

    // 📅 v6.3 เลือกช่วงรอบเองได้ทั้งวันเริ่มและวันจบ — ทับหรือเว้นแค่เตือน ไม่บล็อก
    let periodInfo = null;
    /*
     * 🐛 "ดาวน์โหลดตัวอย่างมาแล้วไม่ตรงกับที่กรอก"
     *    เดิมทุกครั้งที่ข้อมูลรอบโหลดเสร็จ (หรือแตะเดือน/ปี) จะเอาค่าแนะนำเขียนทับช่องวันที่
     *    → คนพิมพ์ 1 ส.ค. ไว้ แล้วค่ามันเด้งกลับเป็น 26 ส.ค. เงียบๆ ก่อนกดปุ่ม
     *    ตอนนี้จำว่าผู้ใช้แตะช่องไหนแล้ว — ช่องที่แตะเองจะไม่ถูกทับ (รีเซ็ตเฉพาะตอนเปลี่ยนเดือน/ปี)
     */
    const userTouched = { start: false, end: false };
    let rangeKey = '';                       // เดือน-ปีที่กำลังโชว์อยู่ — เปลี่ยนเมื่อไหร่ค่อยยอมเติมใหม่
    async function loadPeriodInfo() {
      const year = parseInt(document.getElementById('exportYear').value);
      const month = parseInt(document.getElementById('exportMonth').value);
      const wrap = document.getElementById('cutoffWrap');
      const sIn = document.getElementById('cutoffStart');
      const eIn = document.getElementById('cutoffEnd');
      const hint = document.getElementById('cutoffHint');
      const key = year + '-' + month;
      if (key !== rangeKey) { rangeKey = key; userTouched.start = false; userTouched.end = false; }
      try {
        periodInfo = await apiGet('getPeriodInfo', { email: session.Email, year, month });
        if (!periodInfo || periodInfo.error) throw new Error('n/a');
        if (key !== rangeKey) return;                                  // ผู้ใช้เปลี่ยนเดือนไปแล้วระหว่างรอ
        if (!userTouched.start || !sIn.value) sIn.value = periodInfo.expectedStart;
        if (!userTouched.end   || !eIn.value) eIn.value = periodInfo.suggestedEnd;
        sIn.max = periodInfo.maxEnd;
        eIn.max = periodInfo.maxEnd;
        hint.innerHTML = (periodInfo.hasSettled
            ? `รอบก่อนปิดถึง <b>${periodInfo.lastSettledTH}</b> — ระบบแนะนำให้เริ่ม ${periodInfo.expectedStartTH}`
            : `ยังไม่เคยปิดรอบ — เริ่มจากบิลเก่าสุดที่มี (${periodInfo.expectedStartTH})`) +
          `<br>เลือกช่วงวันเองได้ทั้งสองช่อง — ระบบไม่มีวันตัดรอบตายตัว`;
        sIn.oninput = () => { userTouched.start = true; checkPeriodRange(); };
        eIn.oninput = () => { userTouched.end = true;   checkPeriodRange(); };
        sIn.onchange = sIn.oninput;
        eIn.onchange = eIn.oninput;
        checkPeriodRange();
        wrap.style.display = 'block';
      } catch { wrap.style.display = 'none'; periodInfo = null; }
    }

    // นับสดๆ ว่าช่วงนี้ไฟล์จะมีกี่รายการ กี่บาท — ถามหลังบ้านช้าลงนิดหน่อยหลังพิมพ์เสร็จ
    let previewTimer = null, previewSeq = 0;
    function schedulePreview() {
      const box = document.getElementById('rangePreview');
      const s = document.getElementById('cutoffStart').value, e = document.getElementById('cutoffEnd').value;
      if (!box) return;
      if (!s || !e || new Date(e) < new Date(s)) { box.style.display = 'none'; return; }
      box.style.display = 'block';
      box.innerHTML = `📄 ไฟล์จะใช้ช่วง <b>${fmtTH(s)} – ${fmtTH(e)}</b> · กำลังนับรายการ...`;
      clearTimeout(previewTimer);
      const seq = ++previewSeq;
      previewTimer = setTimeout(async () => {
        try {
          const p = await apiGet('previewPeriod', { email: session.Email, start: s, end: e });
          if (seq !== previewSeq) return;                                // พิมพ์ต่อไปแล้ว ผลนี้เก่า
          if (!p || p.error) throw new Error((p && p.error) || 'n/a');
          const autoTxt = (p.autoAllowance || []).length
            ? `<br>🚙📱 รวม allowance อัตโนมัติ ${p.autoAllowance.map(a => (catTH ? catTH(a.Category) : a.Category) + ' ' + Number(a.Amount).toLocaleString()).join(' · ')} บาท`
            : '';
          box.innerHTML = `📄 ไฟล์จะใช้ช่วง <b>${fmtTH(s)} – ${fmtTH(e)}</b><br>` +
            `อนุมัติแล้ว <b>${p.count}</b> รายการ · <b>${Number(p.total || 0).toLocaleString()}</b> บาท` + autoTxt +
            (p.warnings || []).filter(w => /รออนุมัติ/.test(w)).map(w => `<br>${w}`).join('');
        } catch (err) {
          if (seq === previewSeq) box.innerHTML = `📄 ไฟล์จะใช้ช่วง <b>${fmtTH(s)} – ${fmtTH(e)}</b>`;
        }
      }, 500);
    }

    // เตือนแบบสดๆ ถ้าทับรอบก่อนหรือมีวันหาย — คำนวณฝั่งหน้าเว็บ ไม่ต้องยิง server
    function periodWarnings(startStr, endStr) {
      const w = [];
      if (!periodInfo || !startStr || !endStr) return w;
      const day = 86400000;
      const s = new Date(startStr), e = new Date(endStr);
      const exp = new Date(periodInfo.expectedStart);
      if (e < s) { w.push('❌ วันจบอยู่ก่อนวันเริ่ม'); return w; }
      if (periodInfo.hasSettled && s < exp) {
        w.push(`⚠️ ทับกับรอบก่อน ${Math.round((exp - s)/day)} วัน — ช่วงนั้นเบิกไปแล้ว อาจได้เงินซ้ำ`);
      } else if (s > exp) {
        w.push(`⚠️ มีวันหาย ${Math.round((s - exp)/day)} วัน — บิลช่วง ${fmtTH(periodInfo.expectedStart)} ถึง ${fmtTH(new Date(s - day))} จะไม่อยู่ในรอบไหนเลย`);
      }
      return w;
    }

    function fmtTH(v) {
      const d = new Date(v);
      return isNaN(d) ? '-' : d.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric' });
    }

    function checkPeriodRange() {
      const box = document.getElementById('cutoffWarn');
      if (!box) return;
      const w = periodWarnings(document.getElementById('cutoffStart').value,
                               document.getElementById('cutoffEnd').value);
      box.innerHTML = w.length
        ? w.map(x => `<div class="warn-box" style="margin:0 0 6px;font-size:12.5px;">${x}</div>`).join('')
        : '';
      schedulePreview();
    }

    function refreshExportStatus() {
      const year = parseInt(document.getElementById('exportYear').value);
      const month = parseInt(document.getElementById('exportMonth').value);
      const ex = myExports.find(x => Number(x.Year)===year && Number(x.Month)===month);
      const box = document.getElementById('exportStatusBox');
      const act = document.getElementById('exportActions');
      const cw = document.getElementById('cutoffWrap');

      // เลือกวันตัดได้เฉพาะตอนที่ยังไม่ได้ขอ (หรือถูกปฏิเสธมา)
      const canPickCutoff = !ex || ex.OverallStatus === 'Rejected';
      if (canPickCutoff) loadPeriodInfo(); else cw.style.display = 'none';

      // ขั้นปัจจุบัน: 0 ตรวจยอด · 1 รออนุมัติ · 2 อนุมัติแล้ว รอบัญชี · 3 โอนแล้ว
      const stage = !ex || ex.OverallStatus === 'Rejected' ? 0 : ex.OverallStatus === 'Approved' ? (ex.PaidAt ? 3 : 2) : 1;
      const curCls = stage === 1 ? 'cur' : stage === 2 ? 'cur blue' : stage === 3 ? 'cur green' : 'cur';
      const steps = ['1 ตรวจยอด', '2 รออนุมัติ', '3 บัญชีตรวจ/โอน', '4 โอนแล้ว']
        .map((t, i) => `<div class="st ${i < stage ? 'done' : i === stage ? curCls : ''}"><i></i>${t}</div>`).join('');
      const strip = `<div class="xsteps">${steps}</div>`;
      const money = n => Number(n || 0).toLocaleString();

      if (stage === 0) {
        box.innerHTML = strip + (ex
          ? `<div class="xbox red"><div class="h">❌ ไม่อนุมัติ</div><div class="d">${ex.GMRemark || ex.ManagerRemark || ex.SeniorRemark || 'ไม่ได้ระบุเหตุผล'} — แก้แล้วขอใหม่ได้</div></div>`
          : `<div class="xbox gray"><div class="h">📋 ยังไม่ได้ขออนุมัติ ${MONTHS[month-1]} ${year}</div>
               <div class="d">กด "ดูตัวอย่าง" เช็คว่ายอดตรง แล้วกด "ขออนุมัติเพื่อ Export" — ไม่ต้องปริ้นส่ง บัญชีจัดการต่อให้</div></div>`);
        act.innerHTML = `
          <button class="btn btn-primary" onclick="requestApproval()">✅ ขออนุมัติเพื่อ Export</button>
          <button class="btn btn-secondary" onclick="downloadDraft()">👀 ดูตัวอย่างก่อน (ยังใช้เบิกไม่ได้)</button>`;

      } else if (stage === 1) {
        const who = String(ex.GMEmail || ex.SeniorEmail || ex.ManagerEmail || '').split('@')[0];
        box.innerHTML = strip + `<div class="xbox amber"><div class="h"><span class="pulse"></span>⏳ รออนุมัติ</div>
          <div class="d">ส่งถึง <b>${who || 'ผู้อนุมัติ'}</b> แล้ว · ${ex.ItemCount} รายการ · ${money(ex.TotalAmount)} บาท${periodTxt(ex)}<br>อนุมัติแล้วจะแจ้งเตือนที่กระดิ่ง ไม่ต้องทำอะไรเพิ่ม</div></div>`;
        act.innerHTML = `<button class="btn btn-secondary" onclick="downloadDraft()">👀 ดูตัวอย่าง</button>`;

      } else if (stage === 2) {
        box.innerHTML = strip + `<div class="xbox blue"><div class="h"><span class="pulse"></span>✅ อนุมัติแล้ว — รอบัญชีตรวจและโอน</div>
          <div class="d">${ex.ItemCount} รายการ · <b>${money(ex.TotalAmount)} บาท</b>${periodTxt(ex)}<br><b>ไม่ต้องปริ้นส่ง</b> บัญชีเห็นใบนี้บนบอร์ดแล้ว โอนเสร็จจะแจ้งเตือนทันที</div></div>`;
        act.innerHTML = `<button class="btn btn-secondary" onclick="downloadFinal('${ex.ID}')">📥 ดู Excel ที่อนุมัติแล้ว (ไม่ต้องปริ้น)</button>`;

      } else {
        const paidD = new Date(ex.PaidAt).toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });
        box.innerHTML = strip + `<div class="xbox green"><div class="h">💵 โอนเงินแล้ว</div>
          <div class="d">${money(ex.TotalAmount)} บาท · บัญชีโอนเมื่อ ${paidD}${periodTxt(ex)}</div></div>`;
        act.innerHTML = `<button class="btn btn-secondary" onclick="downloadFinal('${ex.ID}')">📥 ดู Excel ที่อนุมัติแล้ว</button>`;
      }
    }

    // แสดงช่วงวันของรอบใต้กล่องสถานะ
    function periodTxt(ex) {
      if (!ex || !ex.PeriodStart || !ex.PeriodEnd) return '';
      const f = s => new Date(s).toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit' });
      return `<br><span style="font-weight:400;font-size:11.5px;opacity:.8;">📅 รอบ ${f(ex.PeriodStart)} – ${f(ex.PeriodEnd)}</span>`;
    }

    window.requestApproval = async () => {
      const year = parseInt(document.getElementById('exportYear').value);
      const month = parseInt(document.getElementById('exportMonth').value);
      const periodStart = (document.getElementById('cutoffStart') || {}).value || '';
      const periodEnd   = (document.getElementById('cutoffEnd') || {}).value || '';

      if (periodStart && periodEnd) {
        if (new Date(periodEnd) < new Date(periodStart)) return showToast('วันจบอยู่ก่อนวันเริ่ม', 'error');
        const w = periodWarnings(periodStart, periodEnd);
        let msg = `ส่งรอบ ${fmtTH(periodStart)} – ${fmtTH(periodEnd)}\n\n`;
        if (w.length) msg += w.join('\n') + '\n\nยืนยันส่งทั้งที่มีคำเตือน?';
        else msg += 'รายการหลังจากวันนี้จะไปอยู่รอบถัดไป\nยืนยันส่งขออนุมัติ?';
        if (!confirm(msg)) return;
      }

      showLoading('กำลังส่งคำขอ...');
      try {
        const r = await apiPost('requestExportApproval', {
          staffEmail: session.Email, year, month, periodStart, periodEnd, requesterEmail: session.Email
        });
        hideLoading();
        if (r.error) throw new Error(r.error);
        showToast(r.auto
          ? '✅ ผ่านอัตโนมัติ — ดาวน์โหลด Excel ได้เลย'
          : 'ส่งคำขอแล้ว รออนุมัติ ✅', 'success');
        await loadMyExports();
      } catch (err) { hideLoading(); showToast(err.message, 'error'); }
    };

    window.downloadDraft = async () => {
      const year = parseInt(document.getElementById('exportYear').value);
      const month = parseInt(document.getElementById('exportMonth').value);
      showLoading('กำลังสร้างตัวอย่าง...');
      try {
        // ส่งช่วงวันที่เพิ่งเลือกไปด้วย ไม่งั้นตัวอย่างจะใช้เดือนปฏิทินแทน
        // ถ้าช่องวันที่ซ่อนอยู่ (ขอไปแล้ว) ไม่ส่ง — ให้หลังบ้านใช้ช่วงของคำขอที่ยื่นไว้
        const pickable = (document.getElementById('cutoffWrap') || {}).style?.display !== 'none';
        const periodStart = pickable ? ((document.getElementById('cutoffStart') || {}).value || '') : '';
        const periodEnd   = pickable ? ((document.getElementById('cutoffEnd') || {}).value || '') : '';
        const r = await apiPost('downloadDraftExport', {
          staffEmail: session.Email, year, month, periodStart, periodEnd, requesterEmail: session.Email });
        hideLoading();
        if (r.error) throw new Error(r.error);
        dl(r);
        // บอกชัดๆ ว่าไฟล์ที่ได้ใช้ช่วงไหน — ถ้าไม่ตรงกับที่กรอกจะรู้ทันที ไม่ต้องเปิดไฟล์
        if (periodStart && r.periodStart && r.periodStart !== periodStart) {
          showToast(`⚠️ ไฟล์ใช้ช่วง ${r.periodLabel} ไม่ใช่ ${fmtTH(periodStart)} — Code.gs บน Google อาจยังเป็นเวอร์ชันเก่า`, 'error');
        } else {
          showToast(`ตัวอย่าง ${r.periodLabel || ''} · ${r.itemCount} รายการ · ${Number(r.totalAmount||0).toLocaleString()} บาท`, 'success');
        }
      } catch (err) { hideLoading(); showToast(err.message, 'error'); }
    };

    window.downloadFinal = async (exportId) => {
      showLoading('กำลังดาวน์โหลด...');
      try {
        const r = await apiPost('downloadFinalExport', { exportId, requesterEmail: session.Email });
        hideLoading();
        if (r.error) throw new Error(r.error);
        dl(r);
        if (r.drift) {
          alert('⚠️ ตัวเลขเปลี่ยนไปหลังจากได้รับอนุมัติ\n\n' +
            'ตอนอนุมัติ: ' + r.drift.approvedCount + ' รายการ · ' + Number(r.drift.approvedTotal).toLocaleString() + ' บาท\n' +
            'ตอนนี้: ' + r.drift.currentCount + ' รายการ · ' + Number(r.drift.currentTotal).toLocaleString() + ' บาท\n\n' +
            'กรุณาตรวจสอบกับหัวหน้าก่อนส่งบัญชี');
        }
        showToast('ดาวน์โหลดสำเร็จ ✅', 'success');
      } catch (err) { hideLoading(); showToast(err.message, 'error'); }
    };

    function dl(result) {
      if (!result.base64) throw new Error('ไม่มีข้อมูลไฟล์');
      const bytes = atob(result.base64);
      const arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      const blob = new Blob([arr], { type: result.mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = result.filename || 'export.xlsx';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    // ── Signature pad ──
    async function initSignature() {
      const canvas = document.getElementById('sigCanvas');
      if (!canvas) return;
      try {
        const r = await getMySignature(session.Email);
        if (r && r.hasSignature && r.dataUrl) {
          document.getElementById('currentSig').src = r.dataUrl;
          document.getElementById('currentSigWrap').style.display = 'block';
        }
      } catch {}
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2.5;
      let drawing = false, empty = true;
      const ph = document.getElementById('sigPlaceholder');
      const pos = e => { const r = canvas.getBoundingClientRect(); return { x:(e.touches?e.touches[0].clientX:e.clientX)-r.left, y:(e.touches?e.touches[0].clientY:e.clientY)-r.top }; };
      const start = e => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
      const draw = e => { if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); empty=false; ph.style.display='none'; e.preventDefault(); };
      const end = () => drawing = false;
      canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',draw);
      canvas.addEventListener('mouseup',end); canvas.addEventListener('mouseout',end);
      canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',draw,{passive:false}); canvas.addEventListener('touchend',end);
      sigPad = {
        isEmpty: () => empty,
        clear: () => { ctx.clearRect(0,0,canvas.width,canvas.height); empty=true; ph.style.display='block'; },
        toDataURL: () => canvas.toDataURL('image/png')
      };
      document.getElementById('clearSigBtn').addEventListener('click', () => sigPad.clear());
      document.getElementById('saveSigBtn').addEventListener('click', onSaveSignature);
      document.getElementById('sigUpload').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2*1024*1024) return showToast('ไฟล์ใหญ่เกิน 2 MB', 'error');
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            sigPad.clear();
            const W = canvas.getBoundingClientRect().width, H = 150;
            const ratio = Math.min(W/img.width, H/img.height);
            const w = img.width*ratio, h = img.height*ratio;
            ctx.drawImage(img, (W-w)/2, (H-h)/2, w, h);
            empty = false; ph.style.display = 'none';
            showToast('โหลดรูปแล้ว — กด "บันทึกลายเซ็น"', 'success');
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });
    }

    async function onSaveSignature() {
      if (!sigPad || sigPad.isEmpty()) return showToast('กรุณาเซ็นหรืออัปโหลดก่อน', 'error');
      const base64 = sigPad.toDataURL();
      showLoading('กำลังบันทึกลายเซ็น...');
      try {
        const r = await saveSignature(session.Email, base64);
        hideLoading();
        if (r && r.error) throw new Error(r.error);
        showToast('บันทึกลายเซ็นสำเร็จ ✅', 'success');
        document.getElementById('currentSig').src = base64;
        document.getElementById('currentSigWrap').style.display = 'block';
        sigPad.clear();
      } catch (err) { hideLoading(); showToast(err.message, 'error'); }
    }

    if (session) { init(); renderBottomNav('profile'); loadMyExports(); initSignature(); }
  </script>
</body>
</html>
