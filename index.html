<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>EXION Expense</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B7081D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EXION Expense">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>
      <img src="icons/logo.png" alt="EXION THAILAND" class="logo">
      <span style="font-size:13px; color:var(--gray-500); font-weight:600; margin-left:4px;">EXPENSE</span>
    </h1>
  </div>

  <div class="container">
    <!-- LOGIN -->
    <div id="loginView" style="display:none;">
      <div class="card card-elev">
        <h2>Welcome</h2>
        <h3>เข้าสู่ระบบ</h3>
        <p style="color:var(--gray-500); font-size:14px; margin:-8px 0 18px;">ใส่ email บริษัทของคุณ</p>
        <div class="field">
          <label>Email ของคุณ <span class="required">*</span></label>
          <input type="email" id="emailInput" placeholder="yourname@exionth.com" autocomplete="email" inputmode="email">
          <div class="hint">ต้องเป็น email ใน Staff sheet</div>
        </div>
        <button class="btn btn-primary" id="loginBtn">เข้าสู่ระบบ</button>
      </div>
    </div>

    <!-- USER VIEW (rendered dynamically per role) -->
    <div id="userView" style="display:none;"></div>

    <div id="initialLoading" class="loading"><div class="spinner"></div></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function setI(id, n) { const el = document.getElementById(id); if (el && typeof icon === 'function') el.innerHTML = icon(n); }

    async function init() {
      const session = getSession();
      document.getElementById('initialLoading').style.display = 'none';
      if (session) showDashboard(session);
      else showLogin();
    }

    async function showLogin() {
      document.getElementById('loginView').style.display = 'block';
      const doLogin = async () => {
        const email = document.getElementById('emailInput').value.trim().toLowerCase();
        if (!email || email.indexOf('@') < 0) return showToast('ใส่ email ให้ถูก', 'error');
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> ตรวจสอบ...';
        try {
          const staff = await verifyStaff(email);
          if (staff && staff.error) throw new Error(staff.error);
          if (!staff) throw new Error('Email นี้ไม่มีสิทธิ์ใช้งาน');
          // Get role
          const role = await getMyRole(email);
          staff.role = role.role;
          staff.isManager = role.isManager;
          staff.isSenior = role.isSenior;
          staff.isGM = role.isGM;
          setSession(staff);
          showDashboard(staff);
        } catch (err) {
          showToast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'เข้าสู่ระบบ';
        }
      };
      document.getElementById('loginBtn').addEventListener('click', doLogin);
      document.getElementById('emailInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    }

    async function showDashboard(session) {
      document.getElementById('loginView').style.display = 'none';
      const view = document.getElementById('userView');
      view.style.display = 'block';

      // Build dashboard based on role
      const role = session.role || 'staff';
      const isGM = !!session.isGM;
      const isSenior = !!session.isSenior;
      const isManager = !!session.isManager;

      view.innerHTML = `
        <div class="card card-hero card-hero-red">
          <div class="user-greet">
            <div class="avatar">${initials(session.Name)}</div>
            <div class="who">
              <div class="greet">สวัสดี ${roleEmoji(role)}</div>
              <div class="name">${session.Name}</div>
              <div class="meta">${session.Department} • ${roleLabel(role)}${session.Team ? ' • ' + session.Team : ''}</div>
            </div>
          </div>
        </div>

        <div class="menu-grid">
          <a href="submit.html" class="menu-tile">
            <div class="icon-box icon-blue">${icon('plus')}</div>
            <div class="label">ขอเบิกใหม่</div>
            <div class="sub">สร้างคำขอ</div>
          </a>
          <a href="status.html" class="menu-tile">
            <div class="icon-box icon-green">${icon('list')}</div>
            <div class="label">คำขอของฉัน</div>
            <div class="sub">ดูสถานะ</div>
          </a>
          ${isManager && !isGM ? `<a href="manager-inbox.html" class="menu-tile">
            <div class="icon-box icon-orange">${icon('bell')}</div>
            <div class="label">Manager Inbox</div>
            <div class="sub" id="mgrCount">— รออนุมัติ</div>
          </a>` : ''}
          ${isSenior || isGM ? `<a href="senior-inbox.html" class="menu-tile">
            <div class="icon-box icon-orange">${icon('bell')}</div>
            <div class="label">Senior Inbox</div>
            <div class="sub" id="snrCount">— รออนุมัติ</div>
          </a>` : ''}
          ${isSenior || isGM ? `<a href="all-requests.html" class="menu-tile">
            <div class="icon-box icon-blue">${icon('list')}</div>
            <div class="label">All Requests</div>
            <div class="sub">ดูทุกคำขอ</div>
          </a>` : ''}
        </div>

        <div class="card" style="margin-top:16px;">
          <h2>เดือนนี้</h2>
          <h3 style="margin-bottom:14px;" id="monthLabel">—</h3>
          <div id="monthStats" class="loading"><div class="spinner"></div></div>
        </div>

        ${isManager || isSenior || isGM ? `<div class="card">
          <h2>${isSenior || isGM ? 'รวมทั้งบริษัท' : 'ทีมของฉัน'}</h2>
          <h3 style="margin-bottom:12px;">Top Spenders</h3>
          <div id="topSpenders" class="loading"><div class="spinner"></div></div>
        </div>` : ''}

        <button class="btn btn-ghost" id="logoutBtn" style="width:100%;">
          ${icon('logout')} ออกจากระบบ
        </button>
      `;

      document.getElementById('monthLabel').textContent = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long' });
      document.getElementById('logoutBtn').addEventListener('click', () => {
        if (confirm('ออกจากระบบ?')) { clearSession(); location.reload(); }
      });

      await loadStats(session);
      renderBottomNav('home');
    }

    function roleEmoji(role) {
      return {gm:'👔', senior:'👑', manager:'👨‍💼', staff:'👋'}[role] || '👋';
    }
    function roleLabel(role) {
      return {gm:'GM', senior:'Senior Approver', manager:'Manager', staff:'Sales'}[role] || 'Sales';
    }

    async function loadStats(session) {
      try {
        const [myReqs, mgrInbox, snrInbox, teamReqs] = await Promise.all([
          fetchMyRequests(session.Email).catch(() => []),
          (session.isManager && !session.isGM) ? fetchManagerInbox(session.Email).catch(() => []) : Promise.resolve([]),
          (session.isSenior || session.isGM) ? fetchSeniorInbox(session.Email).catch(() => []) : Promise.resolve([]),
          (session.isManager && !session.isGM) ? fetchMyTeamRequests(session.Email).catch(() => []) : Promise.resolve([])
        ]);

        // Inbox badges
        const mgrEl = document.getElementById('mgrCount');
        if (mgrEl) mgrEl.textContent = (Array.isArray(mgrInbox) ? mgrInbox.length : 0) + ' รออนุมัติ';
        const snrEl = document.getElementById('snrCount');
        if (snrEl) snrEl.textContent = (Array.isArray(snrInbox) ? snrInbox.length : 0) + ' รออนุมัติ';

        // Month stats (my own)
        const now = new Date();
        const thisMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        const reqs = Array.isArray(myReqs) ? myReqs : [];
        const monthReqs = reqs.filter(r => {
          const d = r.ExpenseDate || r.Timestamp;
          return d && String(d).startsWith(thisMonth);
        });
        const pending = monthReqs.filter(r => r.Status === 'Pending').length;
        const approved = monthReqs.filter(r => r.Status === 'Approved').length;
        const total = monthReqs.reduce((s, r) => s + (Number(r.Amount) || 0), 0);

        document.getElementById('monthStats').classList.remove('loading');
        document.getElementById('monthStats').innerHTML = `
          <div class="stats-grid">
            <div class="stat warning"><div class="value">${pending}</div><div class="label">รออนุมัติ</div></div>
            <div class="stat success"><div class="value">${approved}</div><div class="label">อนุมัติ</div></div>
            <div class="stat accent"><div class="value">${formatCurrency(total)}</div><div class="label">รวม THB</div></div>
          </div>`;

        // Top spenders (Manager → team / Senior → company)
        const topEl = document.getElementById('topSpenders');
        if (topEl) {
          let source;
          if (session.isSenior || session.isGM) source = [...snrInbox, ...await fetchAllRequests(session.Email).catch(() => [])];
          else source = teamReqs;
          source = Array.isArray(source) ? source : [];

          const monthOnly = source.filter(r => {
            const d = r.ExpenseDate || r.Timestamp;
            return d && String(d).startsWith(thisMonth);
          });

          const spenders = {};
          monthOnly.forEach(r => {
            const name = r.StaffName || 'Unknown';
            if (!spenders[name]) spenders[name] = { name, amount: 0, count: 0, dept: r.Department };
            spenders[name].amount += Number(r.Amount) || 0;
            spenders[name].count += 1;
          });
          const sorted = Object.values(spenders).sort((a, b) => b.amount - a.amount).slice(0, 5);

          topEl.classList.remove('loading');
          if (sorted.length === 0) {
            topEl.innerHTML = '<div class="empty" style="padding:20px;"><div class="sub">ยังไม่มีข้อมูล</div></div>';
          } else {
            topEl.innerHTML = sorted.map((s, i) => `
              <div class="spender-row">
                <div class="rank ${i < 3 ? 'top' : ''}">#${i+1}</div>
                <div class="info">
                  <div class="name">${s.name}</div>
                  <div class="meta">${s.dept || '-'} • ${s.count} รายการ</div>
                </div>
                <div class="amount">${formatCurrency(s.amount)}</div>
              </div>`).join('');
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
