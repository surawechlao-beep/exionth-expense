<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ขอเบิกใหม่ — EXION Expense</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B7081D">
  <style>
    .item-card { background:white; border:1.5px solid var(--gray-200); border-radius:14px; padding:16px; margin-bottom:12px; position:relative; }
    .item-card .item-num { position:absolute; top:-10px; left:14px; background:var(--brand-2); color:white; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
    .item-card .remove-item { position:absolute; top:10px; right:10px; background:none; border:none; color:var(--danger); cursor:pointer; font-size:18px; }
    .file-chip { display:inline-flex; align-items:center; gap:6px; background:var(--accent-light); color:var(--brand-2); padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600; margin:4px 4px 0 0; }
    .file-chip button { background:none; border:none; color:var(--brand-2); cursor:pointer; padding:0 4px; font-size:14px; }
    .add-item-btn { width:100%; padding:14px; background:var(--accent-light); color:var(--brand-2); border:2px dashed var(--brand-2); border-radius:12px; font-weight:700; cursor:pointer; font-family:inherit; font-size:14px; }
    .add-item-btn:hover { background:var(--brand-2); color:white; }
    .batch-summary { background:linear-gradient(135deg,var(--accent-dark),var(--brand-2)); color:white; padding:14px; border-radius:12px; text-align:center; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back" onclick="location.href='index.html'" id="backBtn"></button>
    <h1>
      <img src="icons/logo.png" alt="EXION" class="logo" style="height:28px;">
      <span style="font-size:14px; font-weight:600; margin-left:6px;">ขอเบิกใหม่</span>
    </h1>
  </div>

  <div class="container">
    <div class="batch-summary" id="batchSummary">
      <div style="font-size:11px; opacity:0.9; font-weight:600; text-transform:uppercase;">รายการในชุดนี้</div>
      <div style="font-size:28px; font-weight:800; letter-spacing:-0.02em;" id="batchCount">1 รายการ</div>
      <div style="font-size:13px; opacity:0.85; margin-top:2px;" id="batchTotal">รวม 0.00 THB</div>
    </div>

    <div id="itemsContainer"></div>

    <button class="add-item-btn" id="addItemBtn">➕ เพิ่มรายการ</button>

    <button class="btn btn-primary" id="submitBtn" style="margin-top:16px;">
      <span id="iconCheck"></span> ส่งคำขอทั้งหมด
    </button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireLogin();
    let categories = [];
    let currentFuelRate = null;
    let customerHistory = [];
    let items = [];
    let itemSeq = 0;

    async function init() {
      const setI = (id, n) => { const el = document.getElementById(id); if (el && typeof icon === 'function') el.innerHTML = icon(n); };
      setI('backBtn', 'back');
      setI('iconCheck', 'check');

      try {
        const result = await fetchCategories();
        categories = Array.isArray(result) ? result : [];
        if (categories.length === 0) throw new Error('ไม่มีประเภท');
      } catch (err) {
        showToast('โหลดประเภทไม่สำเร็จ: ' + err.message, 'error');
        return;
      }

      try {
        const ch = await fetchCustomerHistory(session.Email);
        customerHistory = Array.isArray(ch) ? ch : [];
      } catch {}

      addItem();  // first row

      document.getElementById('addItemBtn').addEventListener('click', addItem);
      document.getElementById('submitBtn').addEventListener('click', onSubmit);
    }

    function addItem() {
      itemSeq++;
      const id = 'item_' + itemSeq;
      const today = new Date().toISOString().split('T')[0];

      items.push({
        id, category: '', expenseDate: today,
        venue: '', occasion: '', attendees: '',
        amount: 0, mileageKm: 0,
        origin: '', destination: '', customer: '', customerContact: '',
        receipts: []
      });

      renderItems();
      updateBatchSummary();
    }

    function removeItem(id) {
      if (items.length === 1) return showToast('ต้องมีอย่างน้อย 1 รายการ', 'error');
      items = items.filter(i => i.id !== id);
      renderItems();
      updateBatchSummary();
    }

    function renderItems() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = items.map((it, idx) => itemCardHtml(it, idx + 1)).join('');

      items.forEach(it => {
        const sel = document.getElementById(it.id + '_cat');
        if (sel) sel.addEventListener('change', e => onCategoryChange(it.id, e.target.value));
        ['expenseDate','venue','occasion','attendees','amount','mileageKm','origin','destination','customer','customerContact'].forEach(field => {
          const el = document.getElementById(it.id + '_' + field);
          if (el) el.addEventListener('input', e => {
            it[field] = e.target.value;
            if (field === 'mileageKm') updateFuelPreview(it.id);
            if (field === 'amount') updateBatchSummary();
          });
        });
        const fileInput = document.getElementById(it.id + '_files');
        if (fileInput) fileInput.addEventListener('change', e => onFilesSelected(it.id, e));
      });
    }

    function itemCardHtml(it, num) {
      const catList = categories.map(c => `<option value="${c.Code}" ${it.category === c.Code ? 'selected' : ''}>${c.NameTH} — ${c.NameEN}</option>`).join('');
      const cat = categories.find(c => c.Code === it.category);
      const isFuel = it.category === 'FUEL';
      const isEnt = cat && cat.NeedClaimForm === 'YES';
      const needReceipt = cat && cat.NeedReceipt === 'YES';
      const needTravel = cat && cat.NeedTravelInfo === 'YES';

      return `<div class="item-card">
        <span class="item-num">รายการ ${num}</span>
        ${items.length > 1 ? `<button class="remove-item" onclick="removeItem('${it.id}')">✕</button>` : ''}

        <div class="field" style="margin-top:8px;">
          <label>ประเภท <span class="required">*</span></label>
          <select id="${it.id}_cat">
            <option value="">— เลือก —</option>
            ${catList}
          </select>
          <div class="hint">${cat ? cat.Notes || '' : ''}</div>
        </div>

        <div class="field">
          <label>วันที่ <span class="required">*</span></label>
          <input type="date" id="${it.id}_expenseDate" value="${it.expenseDate}">
        </div>

        ${isFuel ? `
        <div class="field">
          <label>กิโลเมตร <span class="required">*</span></label>
          <input type="number" id="${it.id}_mileageKm" step="0.1" min="0" value="${it.mileageKm || ''}" placeholder="เช่น 45.5">
          <div class="hint">คำนวณ: <b id="${it.id}_fuelPreview">0 THB</b></div>
        </div>` : ''}

        ${isEnt ? `
        <div class="field">
          <label>สถานที่ <span class="required">*</span></label>
          <input type="text" id="${it.id}_venue" value="${it.venue}" placeholder="ชื่อร้าน">
        </div>
        <div class="field">
          <label>โอกาส <span class="required">*</span></label>
          <textarea id="${it.id}_occasion" placeholder="เช่น Meeting Q3">${it.occasion}</textarea>
        </div>
        <div class="field">
          <label>ผู้ร่วม <span class="required">*</span></label>
          <textarea id="${it.id}_attendees" placeholder="ชื่อ + บริษัท">${it.attendees}</textarea>
        </div>` : ''}

        ${needTravel ? `
        <div class="field">
          <label>ต้นทาง</label>
          <input type="text" id="${it.id}_origin" value="${it.origin}" placeholder="เช่น ออฟฟิศ กทม">
        </div>
        <div class="field">
          <label>ปลายทาง</label>
          <input type="text" id="${it.id}_destination" value="${it.destination}" placeholder="เช่น โรงงาน ABC ระยอง">
        </div>
        <div class="field">
          <label>ลูกค้า</label>
          <input type="text" id="${it.id}_customer" value="${it.customer}" placeholder="ชื่อบริษัท" list="customerList">
        </div>
        <div class="field">
          <label>ผู้ติดต่อ</label>
          <input type="text" id="${it.id}_customerContact" value="${it.customerContact}" placeholder="ชื่อ ตำแหน่ง">
        </div>` : ''}

        ${(!isFuel && !isEnt) ? `
        <div class="field">
          <label>รายละเอียด</label>
          <input type="text" id="${it.id}_venue" value="${it.venue}" placeholder="เช่น ค่าทางด่วน">
        </div>` : ''}

        ${!isFuel ? `
        <div class="field">
          <label>จำนวนเงิน (THB) <span class="required">*</span></label>
          <input type="number" id="${it.id}_amount" step="0.01" min="0" value="${it.amount || ''}" placeholder="0.00">
        </div>` : ''}

        ${needReceipt ? `
        <div class="field">
          <label>ใบเสร็จ (แนบได้หลายไฟล์) <span class="required">*</span></label>
          <label for="${it.id}_files" class="upload-area">
            <input type="file" id="${it.id}_files" accept="image/*,application/pdf" multiple>
            <div class="icon-wrap" style="color:var(--accent);">📎</div>
            <div class="text">แตะเพื่อแนบไฟล์</div>
            <div class="sub">ภาพ/PDF — สูงสุด 10 ไฟล์ × 5 MB</div>
          </label>
          <div id="${it.id}_filesList" style="margin-top:8px;">${renderFileChips(it)}</div>
        </div>` : ''}
      </div>`;
    }

    function renderFileChips(it) {
      return it.receipts.map((f, i) => `
        <span class="file-chip">📎 ${f.name.length > 20 ? f.name.substr(0,17) + '...' : f.name}
          <button onclick="removeFile('${it.id}', ${i})">✕</button>
        </span>`).join('');
    }

    async function onFilesSelected(itemId, e) {
      const it = items.find(i => i.id === itemId);
      if (!it) return;
      const files = Array.from(e.target.files);
      if (it.receipts.length + files.length > 10) return showToast('ไฟล์เกิน 10', 'error');

      for (const file of files) {
        if (file.size > 5 * 1024 * 1024) { showToast(file.name + ' > 5MB', 'error'); continue; }
        const base64 = await fileToBase64(file);
        it.receipts.push({ name: file.name, base64 });
      }
      document.getElementById(itemId + '_filesList').innerHTML = renderFileChips(it);
      e.target.value = '';
    }

    window.removeFile = (itemId, idx) => {
      const it = items.find(i => i.id === itemId);
      if (!it) return;
      it.receipts.splice(idx, 1);
      document.getElementById(itemId + '_filesList').innerHTML = renderFileChips(it);
    };

    async function onCategoryChange(itemId, code) {
      const it = items.find(i => i.id === itemId);
      if (!it) return;
      it.category = code;
      if (code === 'FUEL' && !currentFuelRate) {
        try {
          currentFuelRate = await fetchFuelRate(session.Email);
        } catch {}
      }
      renderItems();
      updateBatchSummary();
    }

    function updateFuelPreview(itemId) {
      const it = items.find(i => i.id === itemId);
      if (!it || !currentFuelRate) return;
      const km = parseFloat(it.mileageKm) || 0;
      const amount = km * currentFuelRate.rate;
      it.amount = amount;
      const preview = document.getElementById(itemId + '_fuelPreview');
      if (preview) preview.textContent = formatCurrency(amount) + ' THB (' + km + ' × ' + currentFuelRate.rate + ')';
      updateBatchSummary();
    }

    function updateBatchSummary() {
      document.getElementById('batchCount').textContent = items.length + ' รายการ';
      const total = items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
      document.getElementById('batchTotal').textContent = 'รวม ' + formatCurrency(total) + ' THB';
    }

    async function onSubmit() {
      // Validate
      for (const it of items) {
        if (!it.category) return showToast('เลือกประเภทให้ครบ', 'error');
        if (!it.expenseDate) return showToast('ใส่วันที่ให้ครบ', 'error');
        const cat = categories.find(c => c.Code === it.category);
        const isFuel = it.category === 'FUEL';
        const isEnt = cat.NeedClaimForm === 'YES';
        if (isFuel && (!it.mileageKm || it.mileageKm <= 0)) return showToast('ใส่กิโลเมตร', 'error');
        if (!isFuel && (!it.amount || it.amount <= 0)) return showToast('ใส่จำนวนเงิน', 'error');
        if (isEnt && (!it.venue || !it.occasion || !it.attendees)) return showToast('กรอกข้อมูลรับรองให้ครบ', 'error');
        if (cat.NeedReceipt === 'YES' && it.receipts.length === 0) return showToast('แนบใบเสร็จ', 'error');
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> กำลังส่ง...';
      showLoading('กำลังส่งคำขอ ' + items.length + ' รายการ...');

      try {
        const payload = {
          staffEmail: session.Email,
          items: items.map(it => ({
            category: it.category,
            expenseDate: it.expenseDate,
            venue: it.venue,
            occasion: it.occasion,
            attendees: it.attendees,
            amount: it.amount,
            mileageKm: it.mileageKm,
            origin: it.origin,
            destination: it.destination,
            customer: it.customer,
            customerContact: it.customerContact,
            receipts: it.receipts
          }))
        };
        const result = await submitBatch(payload);
        if (result.error) throw new Error(result.error);
        hideLoading();
        showToast('ส่งสำเร็จ! ' + result.items.length + ' รายการ', 'success');
        setTimeout(() => location.href = 'status.html', 1500);
      } catch (err) {
        hideLoading();
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = (typeof icon === 'function' ? icon('check') : '✓') + ' ส่งคำขอทั้งหมด';
      }
    }

    if (session) { init(); renderBottomNav('new'); }
  </script>

  <datalist id="customerList"></datalist>
</body>
</html>
