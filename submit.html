<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ขอเบิกใหม่ — EXION Expense</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B7081D">
</head>
<body>
  <div class="header">
    <button class="back" onclick="location.href='index.html'" id="backBtn"></button>
    <h1><img src="icons/logo.png" alt="EXION" class="logo"><span style="font-size:13px;font-weight:700;margin-left:6px;">ขอเบิกใหม่</span></h1>
  </div>

  <div class="container">
    <div class="info-box" style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:22px;flex-shrink:0;">🍽</span>
      <div style="flex:1;">
        <b>ค่ารับรอง / กอล์ฟ อยู่คนละหน้า</b><br>
        สองประเภทนี้ต้องขออนุมัติวงเงินก่อนไปเลี้ยง
      </div>
      <a href="pre-approve.html" class="btn btn-secondary btn-sm" style="width:auto;padding:9px 14px;text-decoration:none;flex-shrink:0;">ไปหน้านั้น →</a>
    </div>

    <div id="draftZone"></div>

    <div class="batch-summary">
      <div style="font-size:11px;opacity:.9;font-weight:700;text-transform:uppercase;letter-spacing:.06em;">รายการในชุดนี้</div>
      <div style="font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:2px;" id="batchCount">1 รายการ</div>
      <div style="font-size:13px;opacity:.88;margin-top:2px;" id="batchTotal">รวม 0.00 THB</div>
    </div>

    <div id="itemsContainer"></div>

    <button class="add-item-btn" id="addItemBtn" type="button">➕ เพิ่มรายการ <span style="font-size:11px;opacity:.75;">(คัดลอกข้อมูลเดิม)</span></button>

    <button class="btn btn-primary" id="submitBtn" style="margin-top:16px;">✅ ส่งคำขอทั้งหมด</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireLogin();
    const HIDDEN = ['ENT','GOLF'];
    let categories = [], currentFuelRate = null, items = [], itemSeq = 0;

    // ─── กันข้อมูลหาย: เซฟร่างลงเครื่องทุกครั้งที่แก้ ───
    // ไม่เซฟไฟล์แนบ (base64 ใหญ่เกิน localStorage) — เก็บแค่ชื่อไว้เตือน
    let currentBatchId = null;   // รหัสชุดของการกดส่งครั้งนี้ — ใช้ซ้ำถ้าต้องยิงใหม่
    const DRAFT_KEY = 'exion_draft_' + String(session.Email || '').toLowerCase();

    function saveDraft() {
      try {
        syncDom();
        const hasData = items.some(it => it.category || it.amount > 0 || it.mileageKm > 0 || it.venue || it.customer);
        if (!hasData) return localStorage.removeItem(DRAFT_KEY);
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
          savedAt: Date.now(),
          items: items.map(it => Object.assign({}, it, { receipts: [], _files: it.receipts.length }))
        }));
      } catch (e) {}
    }

    function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

    function loadDraft() {
      try {
        const raw = localStorage.getItem(DRAFT_KEY);
        if (!raw) return null;
        const d = JSON.parse(raw);
        // ร่างเก่าเกิน 7 วัน ถือว่าไม่เกี่ยวแล้ว
        if (!d.items || !d.items.length || Date.now() - d.savedAt > 7*86400000) { clearDraft(); return null; }
        return d;
      } catch (e) { return null; }
    }

    function offerDraft(d) {
      const ago = Math.round((Date.now() - d.savedAt) / 60000);
      const when = ago < 60 ? ago + ' นาทีที่แล้ว' : new Date(d.savedAt).toLocaleString('th-TH', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      const files = d.items.reduce((s,it) => s + (it._files||0), 0);
      document.getElementById('draftZone').innerHTML = `
        <div class="warn-box">
          <div class="t">📝 มีใบเบิกที่กรอกค้างไว้</div>
          <div style="font-size:12.5px;color:#78350F;">
            ${d.items.length} รายการ · บันทึกเมื่อ ${when}
            ${files ? '<br>⚠️ ไฟล์แนบ ' + files + ' ไฟล์ต้องแนบใหม่' : ''}
          </div>
          <div class="btn-row" style="margin-top:11px;">
            <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="discardDraft()">ทิ้ง เริ่มใหม่</button>
            <button class="btn btn-primary btn-sm" style="flex:1.3;" onclick="restoreDraft()">↩︎ ทำต่อ</button>
          </div>
        </div>`;
    }

    window.restoreDraft = () => {
      const d = loadDraft();
      if (!d) return;
      document.getElementById('itemsContainer').innerHTML = '';
      items = []; itemSeq = 0;
      d.items.forEach(src => {
        itemSeq++;
        const it = Object.assign({}, src, { id: 'item_' + itemSeq, receipts: [], _dup: false });
        items.push(it);
        const wrap = document.createElement('div');
        wrap.innerHTML = cardHtml(it, items.length);
        document.getElementById('itemsContainer').appendChild(wrap.firstElementChild);
        attach(it);
      });
      refreshNums(); updateSummary();
      document.getElementById('draftZone').innerHTML = '';
      showToast('กู้คืนแล้ว ' + items.length + ' รายการ — อย่าลืมแนบใบเสร็จใหม่', 'success');
    };

    window.discardDraft = () => {
      clearDraft();
      document.getElementById('draftZone').innerHTML = '';
      showToast('ทิ้งร่างแล้ว', 'success');
    };

    const bb = document.getElementById('backBtn');
    if (bb && typeof icon === 'function') bb.innerHTML = icon('back');

    async function init() {
      try {
        const all = await fetchCategories();
        categories = (Array.isArray(all) ? all : []).filter(c => !HIDDEN.includes(c.Code));
        if (!categories.length) throw new Error('ไม่มีประเภท');
      } catch (err) {
        document.getElementById('itemsContainer').innerHTML = `<div class="empty"><div class="icon-wrap">⚠️</div>
          <div class="title">โหลดประเภทค่าใช้จ่ายไม่สำเร็จ</div><div class="sub">${err.message}</div>
          <button class="btn btn-primary btn-sm" style="margin-top:14px;max-width:180px;" onclick="location.reload()">🔄 ลองใหม่</button></div>`;
        document.getElementById('addItemBtn').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'none';
        return;
      }

      fetchFuelRate(session.Email).then(r => { if (r && !r.error) currentFuelRate = r; }).catch(()=>{});
      fetchCustomerHistory(session.Email).then(ch => {
        const dl = document.getElementById('customerList');
        (Array.isArray(ch)?ch:[]).forEach(c => { const o=document.createElement('option'); o.value=c; dl.appendChild(o); });
      }).catch(()=>{});

      const draft = loadDraft();
      addItem();
      if (draft) offerDraft(draft);

      document.getElementById('addItemBtn').addEventListener('click', addItem);
      document.getElementById('submitBtn').addEventListener('click', onSubmit);

      // เซฟร่างทุก 3 วิหลังหยุดพิมพ์ + ตอนสลับแอป/ปิดหน้า
      document.addEventListener('input', () => { clearTimeout(window.__dt); window.__dt = setTimeout(saveDraft, 3000); });
      document.addEventListener('change', saveDraft);
      window.addEventListener('pagehide', saveDraft);
      document.addEventListener('visibilitychange', () => { if (document.hidden) saveDraft(); });
    }

    // sync DOM → model (fix iOS date picker)
    function syncDom() {
      items.forEach(it => {
        ['expenseDate','venue','occasion','attendees','amount','mileageKm','origin','destination','customer','customerContact'].forEach(f => {
          const el = document.getElementById(it.id + '_' + f);
          if (el && el.value !== undefined && el.value !== '') it[f] = el.value;
        });
      });
    }

    function addItem() {
      syncDom();
      itemSeq++;
      const id = 'item_' + itemSeq;
      const today = new Date().toISOString().split('T')[0];
      const prev = items.length ? items[items.length-1] : null;
      const ni = {
        id,
        category: prev ? prev.category : '',
        expenseDate: prev?.expenseDate || today,
        venue: prev?.venue || '', occasion: prev?.occasion || '', attendees: prev?.attendees || '',
        amount: 0, mileageKm: prev?.mileageKm || 0,
        origin: prev?.origin || '', destination: prev?.destination || '',
        customer: prev?.customer || '', customerContact: prev?.customerContact || '',
        receipts: [], _dup: !!prev
      };
      items.push(ni);
      const wrap = document.createElement('div');
      wrap.innerHTML = cardHtml(ni, items.length);
      const card = wrap.firstElementChild;
      document.getElementById('itemsContainer').appendChild(card);
      attach(ni);
      refreshNums();
      updateSummary();
      setTimeout(() => card.scrollIntoView({behavior:'smooth',block:'center'}), 100);
    }

    function removeItem(id) {
      if (items.length === 1) return showToast('ต้องมีอย่างน้อย 1 รายการ', 'error');
      syncDom();
      const idx = items.findIndex(i => i.id === id);
      if (idx < 0) return;
      items.splice(idx, 1);
      const cards = document.querySelectorAll('#itemsContainer .item-card');
      if (cards[idx]) cards[idx].remove();
      refreshNums();
      updateSummary();
    }
    window.removeItem = removeItem;

    function refreshNums() {
      document.querySelectorAll('#itemsContainer .item-card').forEach((card, i) => {
        const n = card.querySelector('.item-num');
        if (n) n.textContent = 'รายการ ' + (i+1);
        const old = card.querySelector('.remove-item');
        if (old) old.remove();
        if (items.length > 1 && items[i]) {
          const b = document.createElement('button');
          b.className = 'remove-item'; b.type = 'button'; b.textContent = '✕';
          b.addEventListener('click', () => removeItem(items[i].id));
          card.appendChild(b);
        }
      });
    }

    function rerender(it) {
      syncDom();
      const idx = items.findIndex(i => i.id === it.id);
      if (idx < 0) return;
      const cards = document.querySelectorAll('#itemsContainer .item-card');
      if (!cards[idx]) return;
      const wrap = document.createElement('div');
      wrap.innerHTML = cardHtml(it, idx+1);
      cards[idx].replaceWith(wrap.firstElementChild);
      attach(it);
      refreshNums();
    }

    function attach(it) {
      const sel = document.getElementById(it.id + '_cat');
      if (sel) sel.addEventListener('change', e => onCatChange(it.id, e.target.value));
      ['expenseDate','venue','occasion','attendees','amount','mileageKm','origin','destination','customer','customerContact'].forEach(f => {
        const el = document.getElementById(it.id + '_' + f);
        if (!el) return;
        const h = e => {
          it[f] = e.target.value;
          if (f === 'mileageKm') updateFuel(it.id);
          if (f === 'amount') updateSummary();
        };
        el.addEventListener('input', h); el.addEventListener('change', h); el.addEventListener('blur', h);
      });
      const fi = document.getElementById(it.id + '_files');
      if (fi) fi.addEventListener('change', e => onFiles(it.id, e));
    }

    function cardHtml(it, num) {
      const opts = categories.map(c => `<option value="${c.Code}" ${it.category===c.Code?'selected':''}>${c.NameTH} — ${c.NameEN}</option>`).join('');
      const cat = categories.find(c => c.Code === it.category);
      const isFuel = it.category === 'FUEL';
      const isEnt = cat && cat.NeedClaimForm === 'YES';
      // ใบเสร็จมี 3 แบบตามชีท Categories คอลัมน์ NeedReceipt
      //   YES      = บังคับแนบ
      //   OPTIONAL = แนบก็ได้ ไม่แนบก็ได้ (เช่น ค่าโทรศัพท์)
      //   อื่นๆ/ว่าง = ไม่ต้องแนบ ไม่ต้องโชว์ช่องเลย
      const rcptMode = cat ? String(cat.NeedReceipt || '').trim().toUpperCase() : '';
      const needRcpt = rcptMode === 'YES';
      const showRcpt = needRcpt || rcptMode === 'OPTIONAL';
      const needTravel = cat && cat.NeedTravelInfo === 'YES';
      const dup = it._dup && num > 1 ? `<div class="dup-hint">📋 คัดลอกข้อมูลจากรายการก่อน — แก้ไขได้</div>` : '';

      return `<div class="item-card">
        <span class="item-num">รายการ ${num}</span>
        ${dup}
        <div class="field" style="margin-top:10px;">
          <label>ประเภท <span class="required">*</span></label>
          <select id="${it.id}_cat"><option value="">— เลือกประเภท —</option>${opts}</select>
          ${cat && cat.Notes ? `<div class="hint">${cat.Notes}</div>` : ''}
        </div>
        <div class="field">
          <label>วันที่ <span class="required">*</span></label>
          <input type="date" id="${it.id}_expenseDate" value="${it.expenseDate}">
        </div>
        ${isFuel ? `<div class="field">
          <label>ระยะทาง (กม.) <span class="required">*</span></label>
          <input type="number" id="${it.id}_mileageKm" step="0.1" min="0" value="${it.mileageKm||''}" placeholder="เช่น 45.5" inputmode="decimal">
          <div class="hint">💰 คำนวณ: <b id="${it.id}_fuelPreview">0 THB</b></div>
          <div class="hint" style="color:var(--gray-400);">⛽ ใช้ราคาน้ำมันวันที่ 20 ของเดือนนั้น — ถ้ายังไม่ถึงวันที่ 20 ตัวเลขนี้เป็นประมาณการ ระบบจะคิดใหม่ให้เอง</div>
        </div>` : ''}
        ${isEnt ? `
        <div class="field"><label>สถานที่ <span class="required">*</span></label><input type="text" id="${it.id}_venue" value="${it.venue}" placeholder="ชื่อร้าน"></div>
        <div class="field"><label>โอกาส <span class="required">*</span></label><textarea id="${it.id}_occasion" rows="2" placeholder="เช่น Meeting Q3">${it.occasion}</textarea></div>
        <div class="field"><label>ผู้ร่วม <span class="required">*</span></label><textarea id="${it.id}_attendees" rows="2" placeholder="ชื่อ + บริษัท">${it.attendees}</textarea></div>` : ''}
        ${needTravel ? `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="field"><label>ต้นทาง</label><input type="text" id="${it.id}_origin" value="${it.origin}" placeholder="ออฟฟิศ"></div>
          <div class="field"><label>ปลายทาง</label><input type="text" id="${it.id}_destination" value="${it.destination}" placeholder="ระยอง"></div>
        </div>
        <div class="field"><label>ลูกค้า</label><input type="text" id="${it.id}_customer" value="${it.customer}" placeholder="ชื่อบริษัท" list="customerList"></div>
        <div class="field"><label>ผู้ติดต่อ</label><input type="text" id="${it.id}_customerContact" value="${it.customerContact}" placeholder="ชื่อ ตำแหน่ง"></div>` : ''}
        ${(!isFuel && !isEnt) ? `<div class="field"><label>รายละเอียด</label><input type="text" id="${it.id}_venue" value="${it.venue}" placeholder="เช่น ค่าทางด่วน"></div>` : ''}
        ${!isFuel ? `<div class="field"><label>จำนวนเงิน (THB) <span class="required">*</span></label><input type="number" id="${it.id}_amount" step="0.01" min="0" value="${it.amount||''}" placeholder="0.00" inputmode="decimal"></div>` : ''}
        ${showRcpt ? `<div class="field">
          <label>ใบเสร็จ ${needRcpt ? '<span class="required">*</span>' : '<span class="optional-tag">ไม่บังคับ</span>'}</label>
          <label for="${it.id}_files" class="upload-area">
            <input type="file" id="${it.id}_files" accept="image/*,application/pdf" multiple>
            <div class="icon-wrap">📎</div>
            <div class="text">${needRcpt ? 'แตะเพื่อแนบไฟล์' : 'แตะเพื่อแนบไฟล์ (ถ้ามี)'}</div>
            <div class="sub">${needRcpt ? 'ภาพ/PDF · สูงสุด 10 ไฟล์ × 5 MB' : 'มีบิลก็แนบได้ ไม่มีก็ส่งได้เลย'}</div>
          </label>
          <div id="${it.id}_chips" style="margin-top:8px;">${chips(it)}</div>
        </div>` : ''}
      </div>`;
    }

    function chips(it) {
      return it.receipts.map((f,i) => `<span class="file-chip">📎 ${f.name.length>18?f.name.substr(0,15)+'...':f.name}<button type="button" onclick="removeFile('${it.id}',${i})">✕</button></span>`).join('');
    }

    async function onFiles(itemId, e) {
      const it = items.find(i => i.id === itemId);
      if (!it) return;
      const files = Array.from(e.target.files);
      if (it.receipts.length + files.length > 10) return showToast('ไฟล์เกิน 10', 'error');
      for (const f of files) {
        if (f.size > 5*1024*1024) { showToast(f.name + ' > 5MB', 'error'); continue; }
        it.receipts.push({ name: f.name, base64: await fileToBase64(f) });
      }
      const c = document.getElementById(itemId + '_chips');
      if (c) c.innerHTML = chips(it);
      e.target.value = '';
    }

    window.removeFile = (itemId, idx) => {
      const it = items.find(i => i.id === itemId);
      if (!it) return;
      it.receipts.splice(idx, 1);
      const c = document.getElementById(itemId + '_chips');
      if (c) c.innerHTML = chips(it);
    };

    async function onCatChange(itemId, code) {
      const it = items.find(i => i.id === itemId);
      if (!it) return;
      it.category = code;
      if (code === 'FUEL' && !currentFuelRate) {
        fetchFuelRate(session.Email).then(r => { if (r && !r.error) { currentFuelRate = r; updateFuel(itemId); } }).catch(()=>{});
      }
      rerender(it);
      updateSummary();
    }

    function updateFuel(itemId) {
      const it = items.find(i => i.id === itemId);
      if (!it || !currentFuelRate) return;
      const km = parseFloat(it.mileageKm) || 0;
      it.amount = km * currentFuelRate.rate;
      const p = document.getElementById(itemId + '_fuelPreview');
      if (p) {
        const rt = currentFuelRate.rateType ? ' · ' + currentFuelRate.rateType : '';
        p.textContent = formatCurrency(it.amount) + ' THB (' + km + ' กม. × ' + currentFuelRate.rate + ')' + rt;
      }
      updateSummary();
    }

    function updateSummary() {
      document.getElementById('batchCount').textContent = items.length + ' รายการ';
      const t = items.reduce((s,it) => s + (parseFloat(it.amount)||0), 0);
      document.getElementById('batchTotal').textContent = 'รวม ' + formatCurrency(t) + ' THB';
    }

    /** ชี้ให้เห็นว่าผิดตรงไหน แทนที่จะบอกลอยๆ */
    function flagError(itemId, field, msg, num) {
      document.querySelectorAll('.field.has-error').forEach(el => el.classList.remove('has-error'));
      const el = field ? document.getElementById(itemId + '_' + field) : null;
      const card = document.querySelectorAll('#itemsContainer .item-card')[num - 1];
      const target = (el && el.closest('.field')) || card;
      if (target) {
        if (el && el.closest('.field')) el.closest('.field').classList.add('has-error');
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (el) setTimeout(() => { try { el.focus({ preventScroll: true }); } catch (e) {} }, 350);
      }
      showToast('รายการ ' + num + ': ' + msg, 'error');
    }

    async function onSubmit() {
      syncDom();
      for (let i = 0; i < items.length; i++) {
        const it = items[i], num = i + 1;
        if (!it.category)    return flagError(it.id, 'cat', 'ยังไม่ได้เลือกประเภท', num);
        if (!it.expenseDate) return flagError(it.id, 'expenseDate', 'ยังไม่ได้ใส่วันที่', num);
        const cat = categories.find(c => c.Code === it.category);
        const isFuel = it.category === 'FUEL';
        if (isFuel && (!it.mileageKm || it.mileageKm <= 0)) return flagError(it.id, 'mileageKm', 'ยังไม่ได้ใส่ระยะทาง', num);
        if (!isFuel && (!it.amount || it.amount <= 0))      return flagError(it.id, 'amount', 'ยังไม่ได้ใส่จำนวนเงิน', num);
        if (cat.NeedClaimForm === 'YES') {
          if (!it.venue)     return flagError(it.id, 'venue', 'ยังไม่ได้ใส่สถานที่', num);
          if (!it.occasion)  return flagError(it.id, 'occasion', 'ยังไม่ได้ใส่โอกาส', num);
          if (!it.attendees) return flagError(it.id, 'attendees', 'ยังไม่ได้ใส่ผู้ร่วม', num);
        }
        // บังคับเฉพาะ YES — OPTIONAL แนบหรือไม่แนบก็ผ่าน
        if (String(cat.NeedReceipt || '').trim().toUpperCase() === 'YES' && !it.receipts.length)
          return flagError(it.id, 'files', 'ยังไม่ได้แนบใบเสร็จ', num);
      }
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      showLoading('กำลังส่ง ' + items.length + ' รายการ...');

      /*
       * 🔑 รหัสชุด — สร้างครั้งเดียวต่อการกดส่ง 1 ครั้ง
       *
       * เดิม server เดาว่ารายการไหนซ้ำจากเนื้อหา (ประเภท+วันที่+ยอด)
       * ค่าทางด่วนไป-กลับวันเดียวกันยอดเท่ากันก็โดนมองว่าซ้ำแล้วหายไป
       *
       * ตอนนี้ยึดรหัสนี้แทน — เน็ตหลุดแล้วกดส่งซ้ำ จะใช้รหัสเดิม
       * server เห็นว่าเขียนไปแล้วก็ไม่เขียนซ้ำ ส่วนการกดส่งชุดใหม่ได้รหัสใหม่เสมอ
       * จึงเข้าครบทุกใบต่อให้ยอดเท่ากันเป๊ะ
       *
       * เก็บใน currentBatchId เพื่อให้การกดส่งซ้ำหลังยิงไม่สำเร็จใช้รหัสเดิม
       */
      if (!currentBatchId) {
        currentBatchId = 'BATCH-' + Date.now().toString(36).toUpperCase() + '-' +
          Math.random().toString(36).substr(2, 6).toUpperCase();
      }

      try {
        const result = await submitBatch({
          staffEmail: session.Email,
          batchId: currentBatchId,
          items: items.map(it => ({
            category: it.category, expenseDate: it.expenseDate, venue: it.venue,
            occasion: it.occasion, attendees: it.attendees, amount: it.amount,
            mileageKm: it.mileageKm, origin: it.origin, destination: it.destination,
            customer: it.customer, customerContact: it.customerContact, receipts: it.receipts
          }))
        });
        hideLoading();
        if (result.error) throw new Error(result.error);
        clearDraft();
        currentBatchId = null;                     // ส่งสำเร็จแล้ว รอบหน้าใช้รหัสใหม่

        const saved = (result.items || []).length;
        if (result.alreadySubmitted) {
          // ยิงซ้ำจากเน็ตหลุด — ของเดิมเข้าไปแล้วครบ ไม่ได้หายไปไหน
          showToast('ชุดนี้ส่งสำเร็จไปแล้ว ' + saved + ' รายการ', 'success');
        } else {
          showToast('✅ ส่งสำเร็จ ' + saved + ' รายการ', 'success');
        }
        setTimeout(() => location.href = 'status.html', 1400);
      } catch (err) {
        hideLoading();
        // ❗ ไม่ล้าง currentBatchId — กดส่งใหม่จะใช้รหัสเดิม ไม่เกิดรายการซ้ำ
        showToast(err.message + ' — กดส่งอีกครั้งได้เลย ไม่เกิดรายการซ้ำ', 'error');
        btn.disabled = false;
      }
    }

    if (session) { init(); renderBottomNav('new'); }
  </script>
  <datalist id="customerList"></datalist>
</body>
</html>
