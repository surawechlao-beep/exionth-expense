<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — EXION</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#B7081D">
</head>
<body>
  <div class="header">
    <button class="back" onclick="location.href='index.html'" id="backBtn"></button>
    <h1>
      <img src="icons/logo.png" alt="EXION" class="logo" style="height:28px;">
      <span style="font-size:14px; font-weight:600; margin-left:6px;">Reset Password</span>
    </h1>
  </div>

  <div class="container">
    <!-- Step 1: Request reset -->
    <div id="requestStep" style="display:none;">
      <div class="card card-elev">
        <h2>ลืมรหัสผ่าน</h2>
        <h3>Reset ผ่าน Email</h3>
        <p style="color:var(--gray-500); font-size:14px; margin:-8px 0 18px;">
          ใส่ email บริษัทของคุณ → ระบบจะส่งลิงก์ reset (หมดอายุ 1 ชั่วโมง)
        </p>
        <div class="field">
          <label>Email <span class="required">*</span></label>
          <input type="email" id="email" placeholder="yourname@exionth.com">
        </div>
        <button class="btn btn-primary" id="requestBtn">ส่งลิงก์ Reset</button>
      </div>
    </div>

    <!-- Step 2: Set new password (when ?token=xxx) -->
    <div id="setNewStep" style="display:none;">
      <div class="card card-elev">
        <h2>ตั้งรหัสใหม่</h2>
        <h3 id="emailShow">—</h3>
        <p style="color:var(--gray-500); font-size:14px; margin:-8px 0 18px;">อย่างน้อย 8 ตัว มีตัวเลข</p>
        <div class="field">
          <label>รหัสผ่านใหม่ <span class="required">*</span></label>
          <input type="password" id="newPwd" autocomplete="new-password">
        </div>
        <div class="field">
          <label>ยืนยันรหัสผ่าน <span class="required">*</span></label>
          <input type="password" id="newPwd2" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" id="resetBtn">ตั้งรหัสใหม่</button>
      </div>
    </div>

    <!-- Done -->
    <div id="doneStep" style="display:none;">
      <div class="card" style="text-align:center; padding:48px 24px;">
        <div style="font-size:64px;">✅</div>
        <h2 style="margin:10px 0;">Reset สำเร็จ</h2>
        <p style="color:var(--gray-500);">ตั้งรหัสใหม่เรียบร้อย ลอง login ใหม่</p>
        <a href="index.html" class="btn btn-primary" style="display:inline-block; text-decoration:none; margin-top:16px;">ไปหน้า Login</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function setI(id, n) { const el = document.getElementById(id); if (el && typeof icon === 'function') el.innerHTML = icon(n); }
    setI('backBtn', 'back');

    const urlParams = new URLSearchParams(location.search);
    const token = urlParams.get('token');
    const emailFromLink = urlParams.get('email');

    if (token && emailFromLink) {
      document.getElementById('setNewStep').style.display = 'block';
      document.getElementById('emailShow').textContent = emailFromLink;

      document.getElementById('resetBtn').addEventListener('click', async () => {
        const pwd = document.getElementById('newPwd').value;
        const pwd2 = document.getElementById('newPwd2').value;
        if (pwd.length < 8) return showToast('รหัสต้อง ≥ 8 ตัว', 'error');
        if (!/[0-9]/.test(pwd)) return showToast('ต้องมีตัวเลข', 'error');
        if (pwd !== pwd2) return showToast('รหัสไม่ตรง', 'error');
        showLoading('Reset...');
        try {
          const r = await resetPassword(emailFromLink, token, pwd, pwd2);
          if (r.error) throw new Error(r.error);
          hideLoading();
          document.getElementById('setNewStep').style.display = 'none';
          document.getElementById('doneStep').style.display = 'block';
        } catch (err) {
          hideLoading();
          showToast(err.message, 'error');
        }
      });
    } else {
      document.getElementById('requestStep').style.display = 'block';
      document.getElementById('requestBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim().toLowerCase();
        if (!email || email.indexOf('@') < 0) return showToast('ใส่ email ให้ถูก', 'error');
        showLoading('ส่งลิงก์...');
        try {
          await requestPasswordReset(email);
          hideLoading();
          showToast('ส่งลิงก์ไปแล้ว ตรวจ inbox/junk', 'success');
        } catch (err) {
          hideLoading();
          showToast(err.message, 'error');
        }
      });
    }
  </script>
</body>
</html>
