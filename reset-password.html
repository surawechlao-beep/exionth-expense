<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — EXION</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B7081D">
</head>
<body>
  <div class="header">
    <button class="back" onclick="location.href='index.html'" id="backBtn"></button>
    <h1><img src="icons/logo.png" alt="EXION" class="logo"><span style="font-size:13px;font-weight:700;margin-left:6px;">Reset Password</span></h1>
  </div>

  <div class="container">
    <!-- Step 1 -->
    <div id="requestStep" style="display:none;">
      <div class="auth-card">
        <h2>ลืมรหัสผ่าน</h2>
        <h3>Reset ผ่าน Email</h3>
        <p style="color:var(--gray-500);font-size:13.5px;margin:0 0 18px;line-height:1.5;">
          ใส่ email บริษัท → ระบบส่งลิงก์ reset (หมดอายุ 1 ชั่วโมง)
        </p>
        <div class="field">
          <label>Email <span class="required">*</span></label>
          <input type="email" id="email" placeholder="yourname@exionth.com" inputmode="email">
        </div>
        <button class="btn btn-primary" id="requestBtn">📧 ส่งลิงก์ Reset</button>
        <div style="text-align:center;margin-top:14px;">
          <a href="index.html" style="color:var(--gray-500);font-size:12.5px;">← กลับหน้า Login</a>
        </div>
      </div>
      <div id="sentZone"></div>
    </div>

    <!-- Step 2 -->
    <div id="setNewStep" style="display:none;">
      <div class="auth-card">
        <h2>ตั้งรหัสใหม่</h2>
        <h3 id="emailShow">—</h3>
        <p style="color:var(--gray-500);font-size:13.5px;margin:0 0 18px;">อย่างน้อย 8 ตัว มีตัวเลข</p>
        <div class="field">
          <label>รหัสผ่านใหม่ <span class="required">*</span></label>
          <input type="password" id="newPwd" autocomplete="new-password">
        </div>
        <div class="field">
          <label>ยืนยันรหัสผ่าน <span class="required">*</span></label>
          <input type="password" id="newPwd2" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" id="resetBtn">✅ ตั้งรหัสใหม่</button>
      </div>
    </div>

    <!-- Done -->
    <div id="doneStep" style="display:none;">
      <div class="card">
        <div class="success-screen">
          <div class="big-ic">✅</div>
          <h2>Reset สำเร็จ</h2>
          <p>ตั้งรหัสใหม่เรียบร้อย</p>
          <a href="index.html" class="btn btn-primary" style="display:inline-flex;text-decoration:none;max-width:240px;margin:0 auto;">ไปหน้า Login →</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const bb = document.getElementById('backBtn');
    if (bb && typeof icon === 'function') bb.innerHTML = icon('back');

    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const emailFromLink = params.get('email');

    if (token && emailFromLink) {
      document.getElementById('setNewStep').style.display = 'block';
      document.getElementById('emailShow').textContent = emailFromLink;
      document.getElementById('resetBtn').addEventListener('click', async () => {
        const pwd = document.getElementById('newPwd').value;
        const pwd2 = document.getElementById('newPwd2').value;
        if (pwd.length < 8) return showToast('รหัสต้อง ≥ 8 ตัว', 'error');
        if (!/[0-9]/.test(pwd)) return showToast('ต้องมีตัวเลข', 'error');
        if (pwd !== pwd2) return showToast('รหัสไม่ตรงกัน', 'error');
        showLoading('กำลัง Reset...');
        try {
          const r = await resetPassword(emailFromLink, token, pwd, pwd2);
          hideLoading();
          if (r.error) throw new Error(r.error);
          document.getElementById('setNewStep').style.display = 'none';
          document.getElementById('doneStep').style.display = 'block';
        } catch (err) { hideLoading(); showToast(err.message, 'error'); }
      });
      document.getElementById('newPwd2').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('resetBtn').click();
      });
    } else {
      document.getElementById('requestStep').style.display = 'block';
      document.getElementById('requestBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim().toLowerCase();
        if (!email || email.indexOf('@') < 0) return showToast('ใส่ email ให้ถูก', 'error');
        showLoading('กำลังส่งลิงก์...');
        try {
          await requestPasswordReset(email);
          hideLoading();
          document.getElementById('sentZone').innerHTML = `
            <div class="ok-box" style="margin-top:14px;">
              📧 ส่งลิงก์ไปที่ <b>${email}</b> แล้ว<br>
              <span style="font-weight:400;font-size:12px;">ตรวจ inbox หรือ junk mail — ลิงก์หมดอายุใน 1 ชั่วโมง</span>
            </div>`;
          showToast('ส่งลิงก์แล้ว ✅', 'success');
        } catch (err) { hideLoading(); showToast(err.message, 'error'); }
      });
      document.getElementById('email').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('requestBtn').click();
      });
    }
  </script>
</body>
</html>
