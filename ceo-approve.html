<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>อนุมัติสรุปเบิกจ่าย — CEO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B7081D">
  <style>
    /* ═══ 👑 v9.4 CEO — หน้าเดียว: สรุปเบิกจ่ายรายเดือนที่บัญชีส่งมาขออนุมัติ ═══ */
    .hero-ceo { background: linear-gradient(135deg,#111827,#1F2937 60%,#374151); color: white; border-radius: 20px;
                padding: 16px 18px 14px; margin-bottom: 12px; box-shadow: 0 8px 22px rgba(17,24,39,.28); }
    .hero-ceo .l { font-size: 12px; opacity: .8; font-weight: 600; }
    .hero-ceo .n { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin: 2px 0 2px; }
    .sum { background: white; border: 1.5px solid var(--gray-200); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .sum.pending { border-color: #F59E0B; background: linear-gradient(180deg,#FFFBEB,#fff); }
    .sum.ok { border-left: 6px solid #16A34A; } .sum.bad { border-left: 6px solid #DC2626; opacity: .85; }
    .sum .h { display: flex; align-items: center; gap: 10px; }
    .sum .h .t { flex: 1; min-width: 0; }
    .sum .h .t1 { font-size: 15px; font-weight: 800; color: var(--gray-900); }
    .sum .h .t2 { font-size: 12px; color: var(--gray-500); margin-top: 2px; }
    .sum .h .amt { font-size: 20px; font-weight: 800; white-space: nowrap; }
    .sum .h .amt small { display: block; font-size: 11px; font-weight: 600; color: var(--gray-400); text-align: right; }
    .tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
    .tbl th { text-align: left; font-size: 11px; color: var(--gray-500); font-weight: 700; padding: 6px 4px; border-bottom: 1.5px solid var(--gray-200); }
    .tbl td { padding: 7px 4px; border-bottom: 1px solid var(--gray-100); vertical-align: top; }
    .tbl td.r, .tbl th.r { text-align: right; white-space: nowrap; }
    .tbl tr.tot td { font-weight: 800; border-top: 2px solid var(--gray-300); border-bottom: 0; background: #FFF2CC; }
    .tbl .dept { font-size: 11px; color: var(--gray-400); }
    .tbl .st { font-size: 11px; color: var(--gray-500); }
    .acts { display: flex; gap: 8px; margin-top: 12px; }
    .acts button { flex: 1; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--gray-200); background: white; font: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer; }
    .acts .ok { background: #16A34A; color: white; border-color: #16A34A; flex: 2; }
    .acts .no { color: #B91C1C; border-color: #FCA5A5; background: #FEF2F2; }
    .acts .xl { color: #166534; border-color: #86EFAC; background: #F0FDF4; }
    .acts button:disabled { opacity: .5; cursor: default; }
    .toggle { font-size: 12px; color: #1E40AF; font-weight: 700; cursor: pointer; margin-top: 8px; display: inline-block; }
    .remark { font-size: 12px; color: var(--gray-600); margin-top: 8px; padding: 8px 10px; background: var(--gray-50); border-radius: 10px; }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .chip.warn { background: #FEF3C7; color: #92400E; } .chip.bad { background: #FEE2E2; color: #991B1B; }
    .chip.ok { background: #DCFCE7; color: #166534; }
    .sec { font-size: 12px; font-weight: 800; color: var(--gray-500); margin: 14px 2px 8px; text-transform: uppercase; letter-spacing: .04em; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back" aria-label="ย้อนกลับ" onclick="location.href='index.html'" id="backBtn"></button>
    <h1><img src="icons/logo.png" alt="EXION" class="logo"><span style="font-size:13px;font-weight:700;margin-left:6px;">👑 อนุมัติสรุปเบิกจ่าย</span></h1>
  </div>

  <div class="container">
    <div id="hero"></div>
    <div id="content" class="loading"><div class="spinner"></div></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireLogin();
    const bb = document.getElementById('backBtn');
    if (bb && typeof icon === 'function') bb.innerHTML = icon('back');

    let S = null;
    const money = n => Math.round(Number(n) || 0).toLocaleString();
    const money2 = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const thD = v => { const d = v ? new Date(v) : null; return d && !isNaN(d) ? d.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit' }) : '-'; };
    const MON_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    const ymLabel = ym => { const [y, m] = String(ym || '').split('-'); return (MON_TH[Number(m) - 1] || m) + ' ' + (Number(y) + 543); };
    const COLS = ['Car', 'Fuel', 'Express', 'Mobile', 'Ent.', 'Golf', 'Parking', 'Apt.', 'Hotel', 'Travel', 'Air', 'Overseas', 'Other'];

    async function load() {
      const c = document.getElementById('content');
      if (!S) { c.className = 'loading'; c.innerHTML = '<div class="spinner"></div>'; }
      try {
        const r = await fetchSummaryApprovals(session.Email);
        if (r.error) throw new Error(r.error);
        S = r; render();
      } catch (err) { renderError('content', err.message, load); }
      renderBottomNav('ceo');
    }

    function render() {
      const c = document.getElementById('content');
      c.classList.remove('loading');
      const pend = S.pending || [], hist = S.history || [];
      const total = pend.reduce((t, x) => t + (x.Total || 0), 0);
      document.getElementById('hero').innerHTML = `
        <div class="hero-ceo">
          <div class="l">รออนุมัติ ${pend.length} รายการ</div>
          <div class="n">${money(total)} <span style="font-size:15px;font-weight:600;opacity:.85;">บาท</span></div>
          <div class="l">${S.isCEO ? 'กดดูรายละเอียดแล้วอนุมัติได้เลย' : 'คุณดูได้อย่างเดียว — CEO เป็นคนอนุมัติ'}</div>
        </div>`;
      let html = '';
      if (!pend.length) html += `<div class="empty"><div class="icon-wrap">✅</div><div class="title">ไม่มีสรุปรออนุมัติ</div><div class="sub">บัญชีจะส่งสรุปรายเดือนมาที่นี่</div></div>`;
      else html += pend.map(x => card(x, true)).join('');
      if (hist.length) html += `<div class="sec">ประวัติ</div>` + hist.map(x => card(x, false)).join('');
      c.innerHTML = html;
      wire();
    }

    function card(x, isPending) {
      const rows = x.rows || [];
      const cls = isPending ? 'pending' : x.Status === 'Approved' ? 'ok' : 'bad';
      const chip = isPending ? '<span class="chip warn">⏳ รออนุมัติ</span>' : x.Status === 'Approved' ? '<span class="chip ok">👑 อนุมัติแล้ว</span>' : '<span class="chip bad">❌ ไม่อนุมัติ</span>';
      const tbl = `<table class="tbl" id="tbl-${esc(x.ID)}" style="display:${isPending ? 'table' : 'none'};">
          <thead><tr><th>#</th><th>ชื่อ</th><th class="r">รวม (บาท)</th></tr></thead>
          <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}<div class="dept">${esc(r.dept || '')}${r.status ? ' · <span class="st">' + esc(r.status) + '</span>' : ''}</div>
            <div class="dept">${(r.amounts || []).map((a, k) => a ? COLS[k] + ' ' + money(a) : '').filter(Boolean).join(' · ')}</div></td>
            <td class="r">${money2(r.total)}</td></tr>`).join('')}
          <tr class="tot"><td></td><td>รวม ${rows.length} คน</td><td class="r">${money2(x.Total)}</td></tr></tbody></table>`;
      return `<div class="sum ${cls}" data-id="${esc(x.ID)}">
        <div class="h">
          <div class="t"><div class="t1">${ymLabel(x.ym)}${x.dept && x.dept !== '*' ? ' · ' + esc(x.dept) : ' · ทุกแผนก'} ${chip}</div>
            <div class="t2">ส่งโดย ${esc(String(x.RequestedBy || '').split('@')[0])} · ${thD(x.RequestedAt)} · ${x.StaffCount} คน${x.CEOAt ? ' · ตัดสิน ' + thD(x.CEOAt) : ''}</div></div>
          <div class="amt">${money(x.Total)}<small>บาท</small></div>
        </div>
        ${x.CEORemark ? `<div class="remark">หมายเหตุ: ${esc(x.CEORemark)}</div>` : ''}
        ${isPending ? '' : `<span class="toggle" data-tg="${esc(x.ID)}">ดูรายละเอียด ▾</span>`}
        ${tbl}
        <div class="acts">
          <button class="xl" data-xl="${esc(x.ym)}" data-dept="${esc(x.dept || '*')}">📊 โหลด Excel</button>
          ${isPending && S.isCEO ? `<button class="no" data-no="${esc(x.ID)}">ไม่อนุมัติ</button><button class="ok" data-ok="${esc(x.ID)}" data-amt="${x.Total}" data-ym="${esc(x.ym)}">👑 อนุมัติ ${money(x.Total)} บาท</button>` : ''}
        </div>
      </div>`;
    }

    function saveXlsx(r, fallback) {
      if (!r.base64) throw new Error('ไม่มีไฟล์');
      const bytes = atob(r.base64), arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([arr], { type: r.mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      const a = document.createElement('a'); a.href = url; a.download = r.filename || fallback;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    async function decide(id, decision, btn) {
      const x = (S.pending || []).find(p => p.ID === id);
      let remark = '';
      if (decision === 'Rejected') {
        remark = prompt('เหตุผลที่ไม่อนุมัติ (บัญชีจะเห็นข้อความนี้)');
        if (remark === null) return; remark = remark.trim();
        if (!remark) return showToast('ต้องใส่เหตุผล', 'error');
      } else {
        if (!confirm('อนุมัติสรุปเบิกจ่าย ' + ymLabel(x.ym) + ' รวม ' + money(x.Total) + ' บาท (' + x.StaffCount + ' คน)?')) return;
      }
      btn.disabled = true; showLoading('กำลังบันทึก...');
      try {
        const r = await decideSummary({ requesterEmail: session.Email, id, decision, remark });
        hideLoading();
        if (r.error) throw new Error(r.error);
        showToast(decision === 'Approved' ? '👑 อนุมัติแล้ว — แจ้งบัญชีแล้ว' : 'บันทึกไม่อนุมัติ — แจ้งบัญชีแล้ว', decision === 'Approved' ? 'success' : 'error');
        // ย้ายการ์ดไปประวัติทันที
        S.pending = S.pending.filter(p => p.ID !== id);
        x.Status = decision; x.CEOAt = new Date().toISOString(); x.CEORemark = remark; x.CEOEmail = session.Email;
        S.history = [x].concat(S.history || []);
        render(); setTimeout(load, 1500);
      } catch (e) { hideLoading(); btn.disabled = false; showToast(e.message, 'error'); }
    }

    function wire() {
      document.querySelectorAll('[data-ok]').forEach(b => b.addEventListener('click', () => decide(b.dataset.ok, 'Approved', b)));
      document.querySelectorAll('[data-no]').forEach(b => b.addEventListener('click', () => decide(b.dataset.no, 'Rejected', b)));
      document.querySelectorAll('[data-tg]').forEach(t => t.addEventListener('click', () => {
        const tb = document.getElementById('tbl-' + t.dataset.tg); const open = tb.style.display !== 'none';
        tb.style.display = open ? 'none' : 'table'; t.textContent = open ? 'ดูรายละเอียด ▾' : 'ซ่อน ▴';
      }));
      document.querySelectorAll('[data-xl]').forEach(b => b.addEventListener('click', async () => {
        showLoading('กำลังสร้างไฟล์...');
        try {
          const r = await exportStaffSummary({ requesterEmail: session.Email, ym: b.dataset.xl, dept: b.dataset.dept || '*' });
          hideLoading();
          if (r.error) throw new Error(r.error);
          saveXlsx(r, 'summary.xlsx');
        } catch (e) { hideLoading(); showToast(e.message, 'error'); }
      }));
    }

    onFresh(load);
    load();
  </script>
</body>
</html>
