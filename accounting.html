<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>บอร์ดเบิกจ่าย — ฝ่ายบัญชี</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B7081D">
  <style>
    /* ═══ 🧾 v9.1 บอร์ดบัญชี — การ์ดรายคน ทุกแผนก บอกว่ารอบนี้อยู่ขั้นไหน ═══ */
    .hero-acct { background: linear-gradient(135deg,#065F46,#047857 60%,#10B981); color: white; border-radius: 20px;
                 padding: 16px 18px 14px; margin-bottom: 12px; box-shadow: 0 8px 22px rgba(4,120,87,.28); }
    .hero-acct .l { font-size: 12px; opacity: .85; font-weight: 600; }
    .hero-acct .n { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin: 2px 0 8px; }
    .hero-acct .s { display: flex; gap: 6px; }
    .hero-acct .s button { flex: 1; background: rgba(255,255,255,.16); border: 1.5px solid transparent; color: white; border-radius: 12px;
                           padding: 7px 4px; text-align: center; font: inherit; cursor: pointer; }
    .hero-acct .s button.on { background: white; color: #065F46; }
    .hero-acct .s b { display: block; font-size: 16px; } .hero-acct .s span { font-size: 11px; opacity: .85; }

    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .filters input, .filters select { min-height: 42px; border: 1.5px solid var(--gray-200); border-radius: 12px; padding: 0 12px;
                                      font: inherit; font-size: 13.5px; background: white; width: 100%; }
    .filters .full { grid-column: 1 / -1; }

    .cards { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
    @media (min-width: 720px) { .cards { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1080px) { .cards { grid-template-columns: 1fr 1fr 1fr; } }
    .card-p { background: white; border: 1.5px solid var(--gray-200); border-left-width: 6px; border-radius: 16px; padding: 12px 14px; }
    .card-p.st-ready { border-color: #16A34A; background: linear-gradient(180deg,#F0FDF4,#fff); }
    .card-p.st-paid { border-color: #9CA3AF; background: #F9FAFB; opacity: .85; }
    .card-p.st-export { border-color: #2563EB; }
    .card-p.st-bills { border-color: #F59E0B; }
    .card-p.st-unrequested { border-color: #A855F7; }
    .card-p.st-none { border-color: #E5E7EB; }
    .card-p .top { display: flex; align-items: center; gap: 10px; }
    .card-p .ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
                  font-size: 16px; font-weight: 800; flex-shrink: 0; background: var(--gray-100); color: var(--gray-700); }
    .st-ready .ic { background: #DCFCE7; color: #166534; } .st-export .ic { background: #DBEAFE; color: #1E40AF; }
    .st-bills .ic { background: #FEF3C7; color: #92400E; } .st-paid .ic { background: #E5E7EB; color: #4B5563; }
    .st-unrequested .ic { background: #F3E8FF; color: #6B21A8; }
    .card-p .nm { flex: 1; min-width: 0; }
    .card-p .t1 { font-size: 14.5px; font-weight: 800; color: var(--gray-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-p .t2 { font-size: 11.5px; color: var(--gray-500); margin-top: 1px; }
    .card-p .amt { text-align: right; font-size: 17px; font-weight: 800; color: var(--gray-900); white-space: nowrap; }
    .card-p .amt small { display: block; font-size: 11px; font-weight: 600; color: var(--gray-400); }
    .stage { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; margin-top: 9px; }
    .stage.ready { background: #16A34A; color: white; } .stage.paid { background: #E5E7EB; color: #374151; }
    .stage.export { background: #DBEAFE; color: #1E40AF; } .stage.bills { background: #FEF3C7; color: #92400E; }
    .stage.unrequested { background: #F3E8FF; color: #6B21A8; } .stage.none { background: var(--gray-100); color: var(--gray-500); }
    .card-p .note { font-size: 12px; color: var(--gray-600); margin-top: 6px; line-height: 1.45; }
    .card-p .note b { color: var(--gray-800); }
    .steps { display: flex; gap: 4px; margin-top: 9px; }
    .steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--gray-200); }
    .steps i.on { background: #16A34A; } .steps i.cur { background: #F59E0B; }
    .st-export .steps i.cur { background: #2563EB; }
    .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .acts button { flex: 1; min-height: 40px; padding: 0 10px; border-radius: 11px; border: 1.5px solid var(--gray-200);
                   background: white; font: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer; white-space: nowrap; }
    .acts button:disabled { opacity: .5; cursor: default; }
    .acts .ok { background: #16A34A; color: white; border-color: #16A34A; flex-basis: 100%; }
    .acts .xl { color: #166534; border-color: #86EFAC; background: #F0FDF4; }
    .late { color: #B91C1C; font-weight: 800; }
    .card-p .top { cursor: pointer; }
    .card-p .hint { font-size: 11px; color: var(--gray-400); margin-top: 6px; }
    .bill { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--gray-100); }
    .bill:last-child { border-bottom: none; }
    .bill .bi { width: 34px; height: 34px; border-radius: 10px; background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .bill .bt { flex: 1; min-width: 0; }
    .bill .b1 { font-size: 13.5px; font-weight: 700; color: var(--gray-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bill .b2 { font-size: 11.5px; color: var(--gray-500); margin-top: 1px; }
    .bill .ba { font-size: 14px; font-weight: 800; white-space: nowrap; }
    .bill .rc { min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1.5px solid #86EFAC; background: #F0FDF4; color: #166534; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; flex-shrink: 0; }
    .bill .rc.none { border-color: var(--gray-200); background: white; color: var(--gray-400); cursor: default; }
    .modal-sum { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; padding: 10px 0 4px; border-top: 2px solid var(--gray-200); margin-top: 4px; }
    .count { font-size: 12px; color: var(--gray-500); margin: 2px 2px 8px; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back" aria-label="ย้อนกลับ" onclick="location.href='index.html'" id="backBtn"></button>
    <h1><img src="icons/logo.png" alt="EXION" class="logo"><span style="font-size:13px;font-weight:700;margin-left:6px;">🧾 บอร์ดเบิกจ่าย</span></h1>
  </div>

  <div class="container">
    <div id="hero"></div>
    <div class="filters">
      <input type="month" id="fMonth" aria-label="เดือน">
      <select id="fDept" aria-label="แผนก"><option value="">ทุกแผนก</option></select>
      <select id="fStage" aria-label="สถานะ">
        <option value="">ทุกสถานะ</option>
        <option value="ready">✅ อนุมัติแล้ว รอโอน</option>
        <option value="export">⏳ รออนุมัติ Export</option>
        <option value="bills">📝 บิลรอหัวหน้า</option>
        <option value="unrequested">🟣 ยังไม่ขอ Export</option>
        <option value="none">— ยังไม่ส่ง</option>
        <option value="paid">💵 โอนแล้ว</option>
      </select>
      <input type="search" id="fQ" placeholder="ค้นชื่อ / อีเมล" aria-label="ค้นหา">
    </div>
    <button type="button" id="sumBtn" class="btn btn-secondary" style="width:100%;margin:0 0 10px;min-height:44px;font-weight:800;">📊 สรุปทุกคน Excel (เดือนที่เลือก)</button>
    <div class="count" id="count"></div>
    <div id="content" class="loading"><div class="spinner"></div></div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-head"><h3 id="modalTitle">รายการบิล</h3><button class="modal-close" aria-label="ปิด" onclick="closeModal()">✕</button></div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireLogin();
    const bb = document.getElementById('backBtn');
    if (bb && typeof icon === 'function') bb.innerHTML = icon('back');

    let B = null;
    const F = { ym: '', dept: '', stage: '', q: '' };
    const money = n => Math.round(Number(n) || 0).toLocaleString();
    const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const thD = v => { const d = v ? new Date(v) : null;
      return d && !isNaN(d) ? d.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit' }) : '-'; };
    const MON_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    const ymLabel = ym => { const [y, m] = ym.split('-'); return MON_TH[Number(m) - 1] + ' ' + (Number(y) + 543); };

    // เดือนเริ่มต้น = เดือนนี้
    (function () {
      const d = new Date();
      F.ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      document.getElementById('fMonth').value = F.ym;
    })();

    const STAGE = {
      ready:       { label: '✅ อนุมัติแล้ว — พร้อมโอน', step: 4 },
      paid:        { label: '💵 โอนแล้ว',               step: 5 },
      export:      { label: '⏳ รออนุมัติ Export',        step: 3 },
      unrequested: { label: '🟣 บิลผ่านแล้ว ยังไม่ขอ Export', step: 2 },
      bills:       { label: '📝 บิลรอหัวหน้าอนุมัติ',    step: 1 },
      none:        { label: 'ยังไม่ส่งรายการ',           step: 0 }
    };

    async function load() {
      const c = document.getElementById('content');
      if (!B) { c.className = 'loading'; c.innerHTML = '<div class="spinner"></div>'; }
      try {
        const b = await fetchAccountingBoard(session.Email, F.ym);
        if (b.error) throw new Error(b.error);
        if (b.ym !== F.ym) return;              // ผู้ใช้เปลี่ยนเดือนไปแล้วระหว่างรอ
        B = b; ALLREQ = null;
        fillDepts(); renderHero(); render();
      } catch (err) {
        B = null;
        renderError('content', err.message, load);
      }
      renderBottomNav('acct');
    }

    function fillDepts() {
      const sel = document.getElementById('fDept');
      const cur = sel.value;
      sel.innerHTML = '<option value="">ทุกแผนก</option>' +
        B.departments.map(d => `<option value="${esc(d)}">${d ? esc(d) : 'ไม่ระบุแผนก'}</option>`).join('');
      if ([...sel.options].some(o => o.value === cur)) sel.value = cur; else { sel.value = ''; F.dept = ''; }
    }

    function renderHero() {
      const k = B.counts || {};
      const seg = [['ready', 'พร้อมโอน'], ['export', 'รอ Export'], ['bills', 'รอหัวหน้า'], ['paid', 'โอนแล้ว']];
      document.getElementById('hero').innerHTML = `
        <div class="hero-acct">
          <div class="l">${ymLabel(B.ym)} · พร้อมโอน ${k.ready || 0} คน</div>
          <div class="n">${money(B.readyTotal)} <span style="font-size:15px;font-weight:600;opacity:.85;">บาท</span></div>
          <div class="s">${seg.map(([s, l]) => `<button type="button" data-st="${s}" class="${F.stage === s ? 'on' : ''}"><b>${k[s] || 0}</b><span>${l}</span></button>`).join('')}</div>
        </div>`;
      document.querySelectorAll('.hero-acct [data-st]').forEach(b => b.addEventListener('click', () => {
        F.stage = F.stage === b.dataset.st ? '' : b.dataset.st;
        document.getElementById('fStage').value = F.stage;
        renderHero(); render();
      }));
    }

    function filtered() {
      const q = F.q.trim().toLowerCase();
      return (B.cards || []).filter(c =>
        (!F.dept || c.Department === F.dept) &&
        (!F.stage || c.stage === F.stage) &&
        (!q || [c.Name, c.FullName, c.StaffEmail, c.Team].some(v => String(v || '').toLowerCase().includes(q))));
    }

    function render() {
      const c = document.getElementById('content');
      c.classList.remove('loading');
      const list = filtered();
      document.getElementById('count').textContent = list.length + ' คน' + (list.length !== B.cards.length ? ' (จาก ' + B.cards.length + ')' : '');
      if (!list.length) {
        c.innerHTML = `<div class="empty"><div class="icon-wrap">📭</div><div class="title">ไม่มีใครตรงตัวกรอง</div><div class="sub">ลองเปลี่ยนเดือน / แผนก / สถานะ</div></div>`;
        return;
      }
      c.innerHTML = `<div class="cards">` + list.map(card).join('') + `</div>`;
      wire();
    }

    function card(x) {
      const st = STAGE[x.stage] || STAGE.none;
      const steps = [1, 2, 3, 4].map(i => `<i class="${i < st.step || st.step >= 4 ? 'on' : i === st.step ? 'cur' : ''}"></i>`).join('');
      let note = '';
      if (x.stage === 'bills') note = `รอ <b>${esc(x.pendingWith || 'หัวหน้า')}</b> อนุมัติ ${x.pendingCount} ใบ · ${money(x.pendingAmount)} บาท` +
        (x.unclaimedCount ? `<br>ผ่านแล้ว ${x.unclaimedCount} ใบ · ${money(x.unclaimedAmount)} บาท` : '');
      else if (x.stage === 'unrequested') note = `บิลผ่านแล้ว ${x.unclaimedCount} ใบ · ${money(x.unclaimedAmount)} บาท — รอเซลล์กด "ขออนุมัติ Export"`;
      else if (x.stage === 'export') note = `ส่งเมื่อ ${thD(x.RequestedAt)} · รอ <b>${esc(x.waitingOn || 'ผู้อนุมัติ')}</b> อนุมัติ` +
        (x.days >= 3 ? ` · <span class="late">ค้าง ${x.days} วัน</span>` : '');
      else if (x.stage === 'ready') note = `${esc(x.GMName || 'ผู้อนุมัติ')} อนุมัติ ${thD(x.GMAt)} · รอบ ${thD(x.PeriodStart)} – ${thD(x.PeriodEnd)} · ${x.ItemCount} รายการ` +
        (x.days >= 3 ? ` · <span class="late">รอโอน ${x.days} วัน</span>` : '');
      else if (x.stage === 'paid') note = `โอนแล้ว ${thD(x.PaidAt)}${x.PaidBy ? ' โดย ' + esc(x.PaidBy) : ''} · รอบ ${thD(x.PeriodStart)} – ${thD(x.PeriodEnd)}`;
      else note = x.pendingCount || x.unclaimedCount ? '' : 'ยังไม่มีรายการในรอบนี้';
      const acts = x.stage === 'ready' || x.stage === 'paid' ? `
        <div class="acts">
          <button class="xl" data-dl="${esc(x.exportId)}" data-name="${esc(x.Name)}">📥 Export ขอเบิก</button>
          <button class="xl" data-acct="${esc(x.StaffEmail)}" data-from="${esc(x.PeriodStart)}" data-to="${esc(x.PeriodEnd)}" data-name="${esc(x.Name)}">🧾 Export บัญชี</button>
          ${x.stage === 'ready' ? `<button class="ok" data-paid="${esc(x.exportId)}" data-name="${esc(x.Name)}" data-amt="${x.TotalAmount}">✓ โอนเงินเรียบร้อย — แจ้ง ${esc(x.Name)}</button>` : ''}
        </div>` : '';
      const amt = x.stage === 'ready' || x.stage === 'paid' || x.stage === 'export' ? x.TotalAmount
                : x.stage === 'unrequested' ? x.unclaimedAmount : x.stage === 'bills' ? x.pendingAmount + x.unclaimedAmount : 0;
      return `
        <div class="card-p st-${x.stage}" data-email="${esc(x.StaffEmail)}">
          <div class="top" data-open="${esc(x.StaffEmail)}" role="button" tabindex="0" aria-label="ดูรายการบิลของ ${esc(x.Name)}">
            <div class="ic">${initials(x.Name)}</div>
            <div class="nm">
              <div class="t1">${esc(x.FullName || x.Name)}${x.FullName && x.FullName !== x.Name ? ` <span style="font-weight:600;color:var(--gray-500);">(${esc(x.Name)})</span>` : ''}</div>
              <div class="t2">${esc(x.Department || 'ไม่ระบุแผนก')}${x.Team ? ' · ' + esc(x.Team) : ''}${x.Manager ? ' · หัวหน้า ' + esc(x.Manager) : ''}</div>
            </div>
            <div class="amt">${amt ? money(amt) : '—'}<small>บาท</small></div>
          </div>
          <span class="stage ${x.stage}">${st.label}</span>
          <div class="steps">${steps}</div>
          ${note ? `<div class="note">${note}</div>` : ''}
          <div class="hint">แตะชื่อเพื่อดูรายการบิล + ใบเสร็จ</div>
          ${acts}
        </div>`;
    }

    function saveXlsx(r, fallback) {
      if (!r.base64) throw new Error('ไม่มีไฟล์');
      const bytes = atob(r.base64), arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([arr], { type: r.mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      const a = document.createElement('a'); a.href = url; a.download = r.filename || fallback;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    /* ═══ 🧾 รายการบิลของคนนั้นในรอบนั้น + ดูใบเสร็จ — ในหน้าเดียว ไม่ต้องไปหน้าอื่น ═══ */
    let ALLREQ = null;                       // โหลดครั้งเดียวต่อการเปิดหน้า (ของสดมาเมื่อเปิดการ์ดถัดไป)
    async function allRequests() {
      if (ALLREQ) return ALLREQ;
      const r = await fetchAllRequests(session.Email);
      if (r.error) throw new Error(r.error);
      ALLREQ = Array.isArray(r) ? r : (r.items || []);
      return ALLREQ;
    }
    const ymdOf = v => { const d = v ? new Date(v) : null; return d && !isNaN(d) ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') : ''; };
    async function openDetail(email) {
      const x = (B.cards || []).find(c => c.StaffEmail === email);
      if (!x) return;
      showLoading('กำลังโหลดรายการ...');
      let rows;
      try { rows = await allRequests(); hideLoading(); }
      catch (e) { hideLoading(); return showToast(e.message, 'error'); }
      // ช่วงวัน: มีใบ Export → ใช้ช่วงของใบ · ไม่มี → ทั้งเดือนที่เลือก
      let from = x.PeriodStart, to = x.PeriodEnd, label;
      if (from && to) label = 'รอบ ' + thD(from) + ' – ' + thD(to);
      else { from = B.ym + '-01'; to = B.ym + '-31'; label = ymLabel(B.ym) + ' (ยังไม่มีใบ Export — โชว์ทั้งเดือน)'; }
      const mine = rows.filter(r => String(r.StaffEmail || '').toLowerCase() === email && r.Status !== 'PreApprove')
        .filter(r => { const d = ymdOf(r.ExpenseDate || r.Timestamp); return d && d >= from && d <= to; })
        .sort((a, b) => new Date(a.ExpenseDate || a.Timestamp) - new Date(b.ExpenseDate || b.Timestamp));
      const money2 = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const total = mine.filter(r => r.Status === 'Approved').reduce((t, r) => t + (Number(r.Amount) || 0), 0);
      document.getElementById('modalTitle').textContent = (x.FullName || x.Name) + ' · ' + mine.length + ' รายการ';
      document.getElementById('modalContent').innerHTML =
        `<div style="font-size:12px;color:var(--gray-500);margin-bottom:6px;">${esc(label)}</div>` +
        (mine.length ? mine.map(r => {
          let urls = []; try { urls = JSON.parse(r.ReceiptURLs || '[]'); } catch (e) {}
          if (!urls.length && r.ReceiptURL) urls = [r.ReceiptURL];
          const desc = r.Venue || r.Occasion || (r.Origin && r.Destination ? r.Origin + ' → ' + r.Destination : '') || '';
          const stCls = r.Status === 'Approved' ? 'ok' : r.Status === 'Pending' ? 'warn' : r.Status === 'Rejected' ? 'bad' : 'info';
          return `<div class="bill">
            <div class="bi">${(typeof CAT_ICON_TH !== 'undefined' && CAT_ICON_TH[r.Category]) || '🧾'}</div>
            <div class="bt">
              <div class="b1">${esc((typeof CAT_NAME_TH !== 'undefined' && CAT_NAME_TH[r.Category]) || r.Category)}${desc ? ' · ' + esc(desc) : ''}${r.JobNo ? ' · Job ' + esc(r.JobNo) : ''}</div>
              <div class="b2">${thD(r.ExpenseDate || r.Timestamp)}${r.Mileage_KM ? ' · ' + r.Mileage_KM + ' กม.' : ''} · <span class="chip ${stCls}">${esc(statusTH(r.Status))}</span></div>
            </div>
            <div class="ba">${money2(r.Amount)}</div>
            ${urls.length ? `<button class="rc" data-rc="${esc(r.ID)}" data-n="${urls.length}">📎 ${urls.length > 1 ? urls.length + ' ไฟล์' : 'ใบเสร็จ'}</button>` : `<span class="rc none">ไม่มีไฟล์</span>`}
          </div>`; }).join('') : '<div class="empty" style="padding:18px 0;"><div class="title">ไม่มีรายการในช่วงนี้</div></div>') +
        `<div class="modal-sum"><span>รวมที่อนุมัติแล้ว</span><span>${money2(total)} บาท</span></div>` +
        `<img id="rcptImg" class="preview-img" alt="ใบเสร็จ" style="display:none;">
         <div id="rcptNav" style="display:none;gap:6px;margin-top:8px;"></div>`;
      document.getElementById('modal').classList.add('show');
      document.querySelectorAll('[data-rc]').forEach(b => b.addEventListener('click', () => showReceipt(b.dataset.rc, 0, Number(b.dataset.n) || 1)));
    }
    async function showReceipt(id, idx, n) {
      showLoading('โหลดใบเสร็จ...');
      try {
        const r = await fetchReceiptImage(id, session.Email, idx);
        hideLoading();
        if (r.error) throw new Error(r.error);
        if (!r.dataUrl) throw new Error('ไม่พบไฟล์ใบเสร็จ');
        const img = document.getElementById('rcptImg');
        img.src = r.dataUrl; img.style.display = 'block';
        img.onclick = () => openImageViewer(r.dataUrl, 'แตะ 2 ครั้งเพื่อซูม');
        const nav = document.getElementById('rcptNav');
        const total = r.totalFiles || n || 1;
        if (total > 1) {
          nav.style.display = 'flex';
          nav.innerHTML = Array.from({ length: total }, (_, i) => `<button class="rc ${i === idx ? '' : 'none'}" data-i="${i}">ไฟล์ ${i + 1}</button>`).join('');
          nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => showReceipt(id, Number(b.dataset.i), total)));
        } else nav.style.display = 'none';
        img.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (err) { hideLoading(); showToast(err.message, 'error'); }
    }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }
    document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    window.closeModal = closeModal;

    function wire() {
      document.querySelectorAll('[data-open]').forEach(el => {
        el.addEventListener('click', () => openDetail(el.dataset.open));
        el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(el.dataset.open); } });
      });
      document.querySelectorAll('[data-paid]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('ยืนยันว่าโอนเงินให้ ' + b.dataset.name + ' ' + money(b.dataset.amt) + ' บาทแล้ว?\n\nระบบจะแจ้ง ' + b.dataset.name + ' ทันที และย้อนกลับไม่ได้')) return;
        b.disabled = true; showLoading('กำลังบันทึก...');
        try {
          const r = await markExportPaid(session.Email, b.dataset.paid);
          if (r && r.error) throw new Error(r.error);
          hideLoading(); showToast('💵 บันทึกแล้ว — แจ้ง ' + b.dataset.name + ' แล้ว', 'success');
          // อัปเดตการ์ดทันที ไม่รอโหลดใหม่
          const c = B.cards.find(x => x.exportId === b.dataset.paid);
          if (c) { c.stage = 'paid'; c.PaidAt = new Date().toISOString(); c.PaidBy = session.Name || ''; }
          B.counts.ready = Math.max(0, (B.counts.ready || 1) - 1); B.counts.paid = (B.counts.paid || 0) + 1;
          B.readyTotal -= Number(b.dataset.amt) || 0;
          renderHero(); render();
          setTimeout(load, 1500);
        } catch (e) { hideLoading(); b.disabled = false; showToast(e.message, 'error'); }
      }));
      document.querySelectorAll('[data-dl]').forEach(b => b.addEventListener('click', async () => {
        showLoading('กำลังสร้างฟอร์มขอเบิก...');
        try {
          const r = await apiPost('downloadFinalExport', { exportId: b.dataset.dl, requesterEmail: session.Email });
          hideLoading();
          if (r.error) throw new Error(r.error);
          saveXlsx(r, 'export.xlsx');
        } catch (err) { hideLoading(); showToast(err.message, 'error'); }
      }));
      document.querySelectorAll('[data-acct]').forEach(b => b.addEventListener('click', async () => {
        if (!b.dataset.from || !b.dataset.to) return showToast('ใบนี้ไม่มีช่วงวันบันทึกไว้ — โหลดจากหน้าสรุปแทน', 'error');
        showLoading('กำลังสร้างไฟล์บัญชี...');
        try {
          const r = await exportRequestList({ requesterEmail: session.Email, staffEmail: b.dataset.acct,
            dateFrom: b.dataset.from, dateTo: b.dataset.to, status: 'Approved' });
          hideLoading();
          if (r.error) throw new Error(r.error);
          saveXlsx(r, 'requests.xlsx');
          showToast('โหลดแล้ว · ' + (r.count || 0) + ' รายการ', 'success');
        } catch (err) { hideLoading(); showToast(err.message, 'error'); }
      }));
    }

    // 📊 สรุปทุกคน 1 แถวต่อคน — ฟอร์ม Staff Expense Summary Report
    document.getElementById('sumBtn').addEventListener('click', async () => {
      const btn = document.getElementById('sumBtn');
      btn.disabled = true; showLoading('กำลังสร้างสรุป ' + ymLabel(F.ym) + '...');
      try {
        const r = await exportStaffSummary({ requesterEmail: session.Email, ym: F.ym });
        hideLoading();
        if (r.error) throw new Error(r.error);
        saveXlsx(r, 'summary.xlsx');
        showToast('โหลดแล้ว · ' + r.count + ' คน · มีใบอนุมัติ ' + r.approved + ' คน · รวม ' + money(r.total) + ' บาท', 'success');
      } catch (err) { hideLoading(); showToast(err.message, 'error'); }
      btn.disabled = false;
    });

    document.getElementById('fMonth').addEventListener('change', e => { if (!e.target.value) return; F.ym = e.target.value; B = null; load(); });
    document.getElementById('fDept').addEventListener('change', e => { F.dept = e.target.value; render(); });
    document.getElementById('fStage').addEventListener('change', e => { F.stage = e.target.value; renderHero(); render(); });
    let qt; document.getElementById('fQ').addEventListener('input', e => { F.q = e.target.value; clearTimeout(qt); qt = setTimeout(render, 120); });

    onFresh(load);   // ของสดมา → วาดใหม่เงียบๆ
    load();
  </script>
</body>
</html>
