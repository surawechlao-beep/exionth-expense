<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>อนุมัติคำขอ — Exionth Expense</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F172A">
</head>
<body>
  <div class="header">
    <h1><span class="logo">GM</span> อนุมัติคำขอ</h1>
  </div>

  <div class="container">
    <div id="loading" class="loading"><div class="spinner"></div></div>
    <div id="content" style="display:none;">
      <!-- Summary card -->
      <div class="card card-elev">
        <h2 id="requestCategory">—</h2>
        <h3 style="margin-bottom:16px;"><span id="requestAmount">—</span> <span style="font-size:14px; color:var(--gray-500); font-weight:600;">THB</span></h3>
        <div id="details"></div>
      </div>

      <!-- Receipt card -->
      <div class="card" id="receiptBlock" style="display:none;">
        <h2>ใบเสร็จ</h2>
        <h3 style="margin-bottom:14px;">Receipt</h3>
        <div class="locked-box" id="receiptLocked">
          <div class="lock-icon" id="lockIcon"></div>
          <div class="text">ใบเสร็จเก็บแบบ Private<br>ใส่ email GM ด้านล่างแล้วกดดูได้</div>
          <button class="btn btn-secondary" id="viewReceiptBtn">
            <span id="lockBtnIcon"></span> เปิดดูใบเสร็จ
          </button>
        </div>
        <img id="receiptImg" class="preview-img" style="display:none;">
      </div>

      <!-- Action card -->
      <div class="card" id="actionsBlock">
        <h2>ตัดสินใจ</h2>
        <h3 style="margin-bottom:16px;">Approve / Reject</h3>
        <div class="field">
          <label>Email ของคุณ (GM) <span class="required">*</span></label>
          <input type="email" id="approverEmail" placeholder="gm@exionth.com">
          <div class="hint">ระบบ verify ก่อนแสดงใบเสร็จและบันทึกการอนุมัติ</div>
        </div>
        <div class="field">
          <label>หมายเหตุ <span style="color:var(--gray-400); font-weight:400;">(optional)</span></label>
          <textarea id="remark" placeholder="เช่น Approved ภายในงบ Q2"></textarea>
        </div>
        <div class="field">
          <label>ลายเซ็น <span style="color:var(--gray-400); font-weight:400;">(สำหรับ Approve)</span></label>
          <div id="sigContainer"></div>
        </div>
        <div class="btn-row">
          <button class="btn btn-success" id="approveBtn"><span id="okIcon"></span> Approve</button>
          <button class="btn btn-danger" id="rejectBtn"><span id="xIcon"></span> Reject</button>
        </div>
      </div>

      <!-- Done state -->
      <div class="card" id="doneBlock" style="display:none; text-align:center; padding:48px 24px;">
        <div id="doneIcon" style="font-size:64px; line-height:1; margin-bottom:12px;"></div>
        <h3 id="doneText" style="font-size:22px;"></h3>
        <p style="color:var(--gray-500); margin:8px 0 24px;">พนักงานได้รับ email แจ้งผลแล้ว</p>
        <button class="btn btn-secondary" onclick="window.close() || (location.href='index.html')">ปิดหน้านี้</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(location.search);
    const requestId = urlParams.get('id');

    async function load() {
      document.getElementById('lockIcon').innerHTML = icon('lock');
      document.getElementById('lockBtnIcon').innerHTML = icon('lock');
      document.getElementById('okIcon').innerHTML = icon('check');
      document.getElementById('xIcon').innerHTML = icon('x');

      if (!requestId) {
        document.getElementById('loading').innerHTML =
          '<div class="empty"><div class="title">ไม่พบ Request ID</div></div>';
        return;
      }
      try {
        const r = await fetchRequest(requestId);
        if (!r) throw new Error('ไม่พบคำขอนี้');

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('requestCategory').textContent = r.Category;
        document.getElementById('requestAmount').textContent = formatCurrency(r.Amount);

        const rows = [
          ['Request ID', r.ID],
          ['พนักงาน', r.StaffName + ' (' + r.Department + ')'],
          ['Email', r.StaffEmail],
          ['วันที่', formatDate(r.ExpenseDate)],
          ['สถานที่', r.Venue || '-'],
          ['โอกาส', r.Occasion || '-'],
          ['ผู้ร่วม', r.Attendees || '-'],
          ['สถานะ', statusBadge(r.Status)]
        ];
        document.getElementById('details').innerHTML = rows.map(([k, v]) =>
          `<div class="detail-row"><div class="key">${k}</div><div class="val">${v}</div></div>`
        ).join('');

        if (r.ReceiptURL) {
          document.getElementById('receiptBlock').style.display = 'block';
          document.getElementById('viewReceiptBtn').addEventListener('click', viewReceipt);
        }

        // Inject signature pad
        document.getElementById('sigContainer').innerHTML = signaturePadHtml('sigCanvas');
        setTimeout(() => {
          const canvas = document.getElementById('sigCanvas');
          if (canvas) canvas.__sig = new SignaturePad(canvas);
        }, 50);

        if (r.Status !== 'Pending') {
          document.getElementById('actionsBlock').innerHTML =
            `<div class="empty">
              <div class="icon-wrap">${icon('check')}</div>
              <div class="title">คำขอนี้ ${r.Status} แล้ว</div>
              <div class="sub">โดย: ${r.ApprovedBy || '-'}</div>
            </div>`;
        } else {
          document.getElementById('approveBtn').addEventListener('click', () => decide('Approved'));
          document.getElementById('rejectBtn').addEventListener('click', () => decide('Rejected'));
        }
      } catch (err) {
        document.getElementById('loading').innerHTML =
          `<div class="empty"><div class="title">${err.message}</div></div>`;
      }
    }

    async function viewReceipt() {
      const email = document.getElementById('approverEmail').value.trim();
      if (!email) return showToast('ใส่ email GM ในช่องด้านล่างก่อน', 'error');
      const btn = document.getElementById('viewReceiptBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> กำลังโหลด...';
      try {
        const result = await fetchReceiptImage(requestId, email);
        if (result.error) throw new Error(result.error);
        if (!result.dataUrl) throw new Error('ไม่มีใบเสร็จ');
        document.getElementById('receiptImg').src = result.dataUrl;
        document.getElementById('receiptImg').style.display = 'block';
        document.getElementById('receiptLocked').style.display = 'none';
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = icon('lock') + ' ลองอีกครั้ง';
      }
    }

    async function decide(decision) {
      const approverEmail = document.getElementById('approverEmail').value.trim();
      if (!approverEmail) return showToast('ใส่ email GM', 'error');
      const remark = document.getElementById('remark').value.trim();

      const canvas = document.getElementById('sigCanvas');
      const sigPad = canvas ? canvas.__sig : null;
      let signatureBase64 = '';
      if (decision === 'Approved') {
        if (!sigPad || sigPad.isEmpty()) {
          return showToast('กรุณาเซ็นชื่อก่อนอนุมัติ', 'error');
        }
        signatureBase64 = sigPad.toDataURL();
      }

      if (!confirm(decision === 'Approved' ? 'ยืนยันอนุมัติ?' : 'ยืนยันปฏิเสธ?')) return;

      const isApprove = decision === 'Approved';
      const btn = isApprove ? document.getElementById('approveBtn') : document.getElementById('rejectBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div>';

      try {
        const result = await approveRequest({ id: requestId, decision, remark, approverEmail, signatureBase64 });
        if (result.error) throw new Error(result.error);
        document.getElementById('actionsBlock').style.display = 'none';
        document.getElementById('receiptBlock').style.display = 'none';
        document.getElementById('doneBlock').style.display = 'block';
        document.getElementById('doneIcon').textContent = isApprove ? '✅' : '❌';
        document.getElementById('doneText').textContent = isApprove ? 'อนุมัติเรียบร้อย' : 'ปฏิเสธเรียบร้อย';
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = (isApprove ? icon('check') + ' Approve' : icon('x') + ' Reject');
      }
    }

    load();
  </script>
</body>
</html>
