<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Team — EXION</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#B7081D">
</head>
<body>
  <div class="header">
    <button class="back" onclick="location.href='index.html'" id="backBtn"></button>
    <h1>
      <img src="icons/logo.png" alt="EXION" class="logo" style="height:28px;">
      <span style="font-size:14px; font-weight:600; margin-left:6px;">ทีมของฉัน</span>
    </h1>
  </div>

  <div class="container">
    <div class="card" style="padding:14px;">
      <h2>เลือกเดือนที่จะดู Report</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="field" style="margin:0;">
          <label>ปี</label>
          <select id="year"></select>
        </div>
        <div class="field" style="margin:0;">
          <label>เดือน</label>
          <select id="month">
            <option value="01">มกราคม</option><option value="02">กุมภาพันธ์</option>
            <option value="03">มีนาคม</option><option value="04">เมษายน</option>
            <option value="05">พฤษภาคม</option><option value="06">มิถุนายน</option>
            <option value="07">กรกฎาคม</option><option value="08">สิงหาคม</option>
            <option value="09">กันยายน</option><option value="10">ตุลาคม</option>
            <option value="11">พฤศจิกายน</option><option value="12">ธันวาคม</option>
          </select>
        </div>
      </div>
    </div>

    <div id="list" class="loading"><div class="spinner"></div></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireLogin();
    let teamData = null;

    function setI(id, n) { const el = document.getElementById(id); if (el && typeof icon === 'function') el.innerHTML = icon(n); }
    setI('backBtn', 'back');

    // Populate year
    const ySel = document.getElementById('year');
    const now = new Date();
    for (let y = now.getFullYear(); y >= 2024; y--) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      ySel.appendChild(opt);
    }
    document.getElementById('month').value = String(now.getMonth() + 1).padStart(2, '0');

    async function load() {
      try {
        teamData = await fetchMyTeam(session.Email);
        if (teamData && teamData.error) throw new Error(teamData.error);

        const list = document.getElementById('list');
        list.classList.remove('loading');

        if (!teamData.team || teamData.team.length === 0) {
          list.innerHTML = `<div class="empty"><div class="title">ไม่มีสมาชิกในทีม</div><div class="sub">${teamData.teamName || ''}</div></div>`;
          renderBottomNav('home');
          return;
        }

        let html = `<div class="card" style="background:linear-gradient(135deg,var(--accent-dark),var(--brand-2)); color:white; padding:14px; text-align:center;">
          <div style="font-size:11px; opacity:0.9; font-weight:600; text-transform:uppercase;">${teamData.teamName} Team</div>
          <div style="font-size:32px; font-weight:800; margin-top:4px;">${teamData.team.length} คน</div>
          <div style="font-size:12px; opacity:0.85;">Manager: ${teamData.manager}</div>
        </div>`;

        teamData.team.forEach(member => {
          html += `<div class="card" style="padding:14px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:700; font-size:15px;">${member.Name}</div>
                <div style="font-size:11px; color:var(--gray-500);">${member.Email}</div>
              </div>
              <div class="avatar" style="width:40px; height:40px; font-size:14px;">${initials(member.Name)}</div>
            </div>
            <div class="btn-row" style="margin-top:10px;">
              <button class="btn btn-secondary" style="flex:1; font-size:12px; padding:10px;" onclick="exportReport('${member.Email}', '${member.Name}')">📊 Excel</button>
              <button class="btn btn-primary" style="flex:1; font-size:12px; padding:10px;" onclick="emailReport('${member.Email}', '${member.Name}')">📧 ส่ง Finance</button>
            </div>
          </div>`;
        });

        list.innerHTML = html;
        renderBottomNav('home');
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="empty"><div class="title">${err.message}</div></div>`;
        renderBottomNav('home');
      }
    }

    window.exportReport = async (email, name) => {
      const year = document.getElementById('year').value;
      const month = document.getElementById('month').value;
      showLoading('สร้าง Excel ของ ' + name + '...');
      try {
        const r = await exportStaffReport(email, year, month, session.Email);
        if (r.error) throw new Error(r.error);
        hideLoading();
        showToast('สำเร็จ! ' + r.itemCount + ' รายการ — รวม ' + formatCurrency(r.totalAmount), 'success');
        window.open(r.url, '_blank');
      } catch (err) {
        hideLoading();
        showToast(err.message, 'error');
      }
    };

    window.emailReport = async (email, name) => {
      const year = document.getElementById('year').value;
      const month = document.getElementById('month').value;
      if (!confirm('ส่ง Excel ของ ' + name + ' ไปฝ่ายบัญชี?')) return;
      showLoading('ส่ง email...');
      try {
        const r = await emailStaffReport(email, year, month, session.Email, true);
        if (r.error) throw new Error(r.error);
        hideLoading();
        showToast('ส่งให้บัญชีแล้ว', 'success');
      } catch (err) {
        hideLoading();
        showToast(err.message, 'error');
      }
    };

    if (session) load();
  </script>
</body>
</html>
