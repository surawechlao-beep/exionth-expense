<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ทีมของฉัน — EXION</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B7081D">
  <style>
    .member-card {
      background: white; border: 1px solid var(--gray-200);
      border-radius: var(--r-lg); padding: 14px; margin-bottom: 10px;
      box-shadow: var(--sh-xs);
    }
    .member-top { display: flex; align-items: center; gap: 12px; }
    .member-av {
      width: 46px; height: 46px; border-radius: 14px;
      background: linear-gradient(135deg,#B7081D,#7a0512); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; flex-shrink: 0;
    }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
    .member-mail { font-size: 11px; color: var(--gray-500); overflow: hidden; text-overflow: ellipsis; }
    .member-total { text-align: right; }
    .member-total .n { font-weight: 800; color: var(--accent); font-size: 16px; }
    .member-total .l { font-size: 10px; color: var(--gray-400); }
  </style>
</head>
<body>
  <div class="header">
    <button class="back" onclick="location.href='index.html'" id="backBtn"></button>
    <h1><img src="icons/logo.png" alt="EXION" class="logo"><span style="font-size:13px;font-weight:700;margin-left:6px;">ทีมของฉัน</span></h1>
  </div>

  <div class="container">
    <div class="card">
      <div class="sec-label" style="margin:0 0 10px;">เลือกเดือน</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="field" style="margin:0;">
          <label>เดือน</label>
          <select id="month"></select>
        </div>
        <div class="field" style="margin:0;">
          <label>ปี</label>
          <select id="year"></select>
        </div>
      </div>
    </div>
    <div id="list" class="loading"><div class="spinner"></div></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireLogin();
    let teamData = null;
    let allTeamReqs = [];

    const bb = document.getElementById('backBtn');
    if (bb && typeof icon === 'function') bb.innerHTML = icon('back');

    // Populate selectors
    const mSel = document.getElementById('month'), ySel = document.getElementById('year');
    const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    const now = new Date();
    months.forEach((m,i) => { const o=document.createElement('option'); o.value=i+1; o.textContent=m; if(i+1===now.getMonth()+1) o.selected=true; mSel.appendChild(o); });
    for (let y = now.getFullYear(); y >= now.getFullYear()-3; y--) { const o=document.createElement('option'); o.value=y; o.textContent=y; if(y===now.getFullYear()) o.selected=true; ySel.appendChild(o); }
    mSel.addEventListener('change', render);
    ySel.addEventListener('change', render);

    async function load() {
      try {
        const [team, reqs] = await Promise.all([
          fetchMyTeam(session.Email),
          fetchMyTeamRequests(session.Email).catch(() => [])
        ]);
        if (team && team.error) throw new Error(team.error);
        teamData = team;
        allTeamReqs = Array.isArray(reqs) ? reqs : [];
        render();
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="empty"><div class="icon-wrap">⚠️</div><div class="title">${err.message}</div></div>`;
        renderBottomNav('home');
      }
    }

    function render() {
      const list = document.getElementById('list');
      list.classList.remove('loading');

      if (!teamData || !teamData.team || teamData.team.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon-wrap">👥</div><div class="title">ไม่มีสมาชิกในทีม</div><div class="sub">${teamData?.teamName || ''}</div></div>`;
        renderBottomNav('home');
        return;
      }

      const y = parseInt(ySel.value), m = parseInt(mSel.value);

      // Filter this month approved
      const monthReqs = allTeamReqs.filter(r => {
        if (r.Status !== 'Approved') return false;
        const d = new Date(r.ExpenseDate || r.Timestamp);
        return !isNaN(d) && d.getFullYear() === y && d.getMonth()+1 === m;
      });
      const grandTotal = monthReqs.reduce((s,r) => s + (Number(r.Amount)||0), 0);

      // Per member totals
      const byEmail = {};
      monthReqs.forEach(r => {
        const e = String(r.StaffEmail||'').toLowerCase();
        if (!byEmail[e]) byEmail[e] = { total: 0, count: 0 };
        byEmail[e].total += Number(r.Amount)||0;
        byEmail[e].count++;
      });

      let html = `<div class="count-hero">
        <div class="lbl">${teamData.teamName || 'Team'} · ${months[m-1]} ${y}</div>
        <div class="num">${Math.round(grandTotal).toLocaleString()}</div>
        <div class="sub">THB • ${teamData.team.length} คน • ${monthReqs.length} รายการ</div>
      </div>`;

      // Sort by spend desc
      const sorted = [...teamData.team].sort((a,b) => {
        const ta = byEmail[String(a.Email).toLowerCase()]?.total || 0;
        const tb = byEmail[String(b.Email).toLowerCase()]?.total || 0;
        return tb - ta;
      });

      sorted.forEach(mem => {
        const st = byEmail[String(mem.Email).toLowerCase()] || { total: 0, count: 0 };
        html += `<div class="member-card">
          <div class="member-top">
            <div class="member-av">${initials(mem.Name)}</div>
            <div class="member-info">
              <div class="member-name">${mem.Name}</div>
              <div class="member-mail">${mem.Email}</div>
            </div>
            <div class="member-total">
              <div class="n">${Math.round(st.total).toLocaleString()}</div>
              <div class="l">${st.count} รายการ</div>
            </div>
          </div>
          <div class="btn-row" style="margin-top:11px;">
            <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="viewSummary('${mem.Email}')">👁 ดูรายการ</button>
            <button class="btn btn-primary btn-sm" style="flex:1;" onclick="exportRep('${mem.Email}','${mem.Name.replace(/'/g,"")}')">📊 โหลด Excel</button>
          </div>
          ${session.isViewer ? '' : `<button class="btn btn-secondary btn-sm" style="margin-top:7px;color:#B45309;border-color:#FCD34D;"
                  onclick="resetPwd('${mem.Email}','${mem.Name.replace(/'/g,"")}')">🔑 ล้างรหัสผ่านให้</button>`}
        </div>`;
      });

      list.innerHTML = html;
      renderBottomNav('home');
    }

    window.viewSummary = (email) => { location.href = 'summary.html'; };

    window.exportRep = async (email, name) => {
      const year = parseInt(ySel.value), month = parseInt(mSel.value);
      showLoading('สร้าง Excel ของ ' + name + '...');
      try {
        const r = await exportStaffReport({ staffEmail: email, year, month, requesterEmail: session.Email });
        hideLoading();
        if (r.error) throw new Error(r.error);
        if (r.base64) {
          const bytes = atob(r.base64);
          const arr = new Uint8Array(bytes.length);
          for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
          const blob = new Blob([arr], { type: r.mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = r.filename;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          showToast(`✅ ${r.itemCount} รายการ • ${Math.round(r.totalAmount).toLocaleString()} THB`, 'success');
        }
      } catch (err) { hideLoading(); showToast(err.message, 'error'); }
    };

    /** ลืมรหัสผ่าน — ระบบไม่ส่งอีเมลแล้ว หัวหน้าล้างให้แทน */
    window.resetPwd = async (email, name) => {
      if (!confirm('ล้างรหัสผ่านของ ' + name + ' ?\n\nหลังล้างแล้วเขาจะตั้งรหัสใหม่เองตอนล็อกอินครั้งถัดไป')) return;
      showLoading('กำลังล้างรหัสผ่าน...');
      try {
        const r = await adminResetPassword(session.Email, email);
        hideLoading();
        if (r.error) throw new Error(r.error);
        showToast('ล้างรหัสผ่านของ ' + name + ' แล้ว — แจ้งให้เขาตั้งรหัสใหม่', 'success');
      } catch (err) { hideLoading(); showToast(err.message, 'error'); }
    };

    window.emailRep = async (email, name) => {
      const year = parseInt(ySel.value), month = parseInt(mSel.value);
      if (!confirm('ส่ง Excel ของ ' + name + ' ไปฝ่ายบัญชี?')) return;
      showLoading('กำลังส่ง email...');
      try {
        const r = await emailStaffReport({ staffEmail: email, year, month, requesterEmail: session.Email, ccFinance: true });
        hideLoading();
        if (r.error) throw new Error(r.error);
        showToast('📧 ส่งให้บัญชีแล้ว', 'success');
      } catch (err) { hideLoading(); showToast(err.message, 'error'); }
    };

    if (session) load();
  </script>
</body>
</html>
