<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Summary — EXION Expense</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B7081D">
  <style>
    /* page-specific only — shared components live in css/style.css v6.1 */
    table.xl { min-width: 900px; }
    table.xl td.ctr, table.xl th.ctr { text-align: center; }
    table.xl td.sm { font-size: 10.5px; }
    table.xl td, table.xl th { white-space: nowrap; }
    table.xl td.sm, table.xl td:nth-child(4), table.xl td:nth-child(5) { white-space: normal; }
    table.xl tr.person-hdr td {
      background: linear-gradient(90deg,#B7081D,#7A0512); color: #fff;
      font-weight: 800; padding: 9px; font-size: 12px; letter-spacing: -.01em;
    }
    .chips { display: flex; gap: 6px; margin-top: 11px; }
    .chips button {
      flex: 1; padding: 9px 6px; border: 1.5px solid var(--gray-200); background: #fff;
      border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--gray-600);
      cursor: pointer; font-family: inherit; transition: all .14s ease;
    }
    .chips button.active {
      background: linear-gradient(135deg,#B7081D,#8B0616); color: #fff;
      border-color: transparent; box-shadow: 0 4px 12px rgba(183,8,29,.26);
    }

    /* toolbar เหนือตาราง */
    .tbl-bar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .tbl-bar button {
      padding: 7px 12px; border: 1.5px solid var(--gray-200); background: #fff;
      border-radius: 999px; font-size: 11.5px; font-weight: 700; color: var(--gray-600);
      cursor: pointer; font-family: inherit; transition: all .14s ease;
    }
    .tbl-bar button.on { background: #B7081D; color: #fff; border-color: transparent; }
    .tbl-bar .spacer { flex: 1; }

    /* ดูเต็มจอ */
    .fs-overlay {
      position: fixed; inset: 0; z-index: 4000; background: #fff;
      display: none; flex-direction: column;
    }
    .fs-overlay.show { display: flex; }
    .fs-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--gray-200);
      background: linear-gradient(135deg,#B7081D,#8B0616); color: #fff; flex-shrink: 0;
    }
    .fs-head .t { font-weight: 800; font-size: 14px; }
    .fs-head .s { font-size: 11px; opacity: .85; }
    .fs-head button {
      margin-left: auto; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3);
      color: #fff; width: 34px; height: 34px; border-radius: 50%;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .fs-body { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 10px; }
    .fs-body .xl-wrap { border: none; overflow: visible; }
    .fs-body table.xl { min-width: 100%; font-size: 12.5px; }
    .rotate-hint {
      background: #FEF3C7; color: #92400E; font-size: 11.5px; font-weight: 700;
      padding: 8px 12px; text-align: center; flex-shrink: 0;
    }
    @media (orientation: landscape) { .rotate-hint { display: none; } }
  </style>
</head>
<body>
  <div class="header">
    <button class="back" onclick="location.href='index.html'" id="backBtn"></button>
    <h1><img src="icons/logo.png" alt="EXION" class="logo"><span style="font-size:13px;font-weight:700;margin-left:6px;">สรุปภาพรวม</span></h1>
  </div>

  <div class="container">
    <div class="card">
      <div class="sec-label" style="margin:0 0 10px;">ช่วงเวลา &amp; ขอบเขต</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="field" style="margin:0;"><label>เดือน</label><select id="fMonth"></select></div>
        <div class="field" style="margin:0;"><label>ปี</label><select id="fYear"></select></div>
      </div>
      <div class="field" id="personWrap" style="display:none;margin:10px 0 0;">
        <label>ดูข้อมูลของ</label>
        <select id="fPerson"><option value="__self__">ตัวเอง</option></select>
      </div>
      <div class="chips">
        <button data-st="" class="active" onclick="setStatus('', this)">ทั้งหมด</button>
        <button data-st="Approved" onclick="setStatus('Approved', this)">✅ อนุมัติ</button>
        <button data-st="Pending" onclick="setStatus('Pending', this)">⏳ รออนุมัติ</button>
      </div>
    </div>

    <div id="loading" class="loading"><div class="spinner"></div></div>
    <div id="content" style="display:none;"></div>
  </div>

  <div id="fsOverlay" class="fs-overlay">
    <div class="fs-head">
      <div><div class="t">📋 Preview ข้อมูล</div><div class="s" id="fsSub">—</div></div>
      <button onclick="closeFs()">✕</button>
    </div>
    <div class="rotate-hint">📱 หมุนจอเป็นแนวนอน จะเห็นได้กว้างขึ้น</div>
    <div class="fs-body" id="fsBody"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireLogin();
    const bb = document.getElementById('backBtn');
    if (bb && typeof icon === 'function') bb.innerHTML = icon('back');

    let raw = { scope:'self', myName:'', staffList:[], items:[] };
    let fStatus = '';
    let lastItems = [], lastGroupBy = false, lastSub = '';

    const CAT_TH = {
      FUEL:'น้ำมัน', EXPRESS:'ทางด่วน', PARK:'ที่จอดรถ', HOTEL:'โรงแรม',
      ENT:'รับรอง', GOLF:'กอล์ฟ', TRAVEL:'เดินทาง', OTHER:'อื่นๆ',
      CAR:'ค่ารถเหมา', MOBILE:'โทรศัพท์', OVERSEAS:'โทรตปท.', APT:'ที่พัก'
    };

    async function load() {
      // Populate month/year
      const mSel = document.getElementById('fMonth'), ySel = document.getElementById('fYear');
      const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
      const now = new Date();
      months.forEach((m,i) => { const o=document.createElement('option'); o.value=i+1; o.textContent=m; if(i+1===now.getMonth()+1) o.selected=true; mSel.appendChild(o); });
      for (let y=now.getFullYear(); y>=now.getFullYear()-3; y--) { const o=document.createElement('option'); o.value=y; o.textContent=y; if(y===now.getFullYear()) o.selected=true; ySel.appendChild(o); }
      mSel.addEventListener('change', reload);
      ySel.addEventListener('change', reload);

      try {
        // v6.0 กรองเดือนฝั่ง server — เดิมดึงทุกแถวทั้งระบบมาก้อนเดียว
        const [r, cats] = await Promise.all([
          apiGet('getVisibleRequests', { email: session.Email, year: ySel.value, month: mSel.value }),
          fetchCategories().catch(() => [])
        ]);
        if (r.error) throw new Error(r.error);
        raw = r;

        // ดึงชื่อภาษาไทยของแต่ละประเภทจากชีท Categories
        (Array.isArray(cats) ? cats : []).forEach(c => { if (c.NameTH) CAT_TH[c.Code] = c.NameTH; });

        // Person dropdown (only if team/all scope)
        if (raw.scope === 'team' || raw.scope === 'all') {
          const wrap = document.getElementById('personWrap');
          wrap.style.display = 'block';
          const pSel = document.getElementById('fPerson');
          pSel.innerHTML = '<option value="__self__">👤 ตัวเอง</option><option value="__all__">👥 ทุกคนที่ดูแล</option>';
          raw.staffList.forEach(n => { const o=document.createElement('option'); o.value=n; o.textContent=n; pSel.appendChild(o); });
          pSel.addEventListener('change', render);
        }
        render();
      } catch (err) {
        document.getElementById('loading').innerHTML = `<div class="empty"><div class="title">โหลดข้อมูลไม่สำเร็จ</div><div class="sub">${err.message}</div></div>`;
      }
    }

    /** เปลี่ยนเดือน/ปี → ดึงข้อมูลใหม่จาก server (กรองฝั่ง server) */
    async function reload() {
      document.getElementById('content').style.display = 'none';
      document.getElementById('loading').style.display = '';
      document.getElementById('loading').classList.add('loading');
      try {
        const r = await apiGet('getVisibleRequests', {
          email: session.Email,
          year: document.getElementById('fYear').value,
          month: document.getElementById('fMonth').value
        });
        if (r.error) throw new Error(r.error);
        raw = r;
        render();
      } catch (err) {
        document.getElementById('loading').classList.remove('loading');
        document.getElementById('loading').innerHTML =
          `<div class="empty"><div class="icon-wrap">⚠️</div><div class="title">โหลดข้อมูลไม่สำเร็จ</div><div class="sub">${err.message}</div></div>`;
      }
    }

    function setStatus(st, btn) {
      fStatus = st;
      document.querySelectorAll('.chips button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function getFiltered() {
      const y = parseInt(document.getElementById('fYear').value);
      const m = parseInt(document.getElementById('fMonth').value);
      const pSel = document.getElementById('fPerson');
      const person = pSel ? pSel.value : '__self__';

      return raw.items.filter(r => {
        // month
        const d = new Date(r.ExpenseDate || r.Timestamp);
        if (isNaN(d) || d.getFullYear() !== y || d.getMonth()+1 !== m) return false;
        // status
        if (fStatus && r.Status !== fStatus) return false;
        // person
        if (person === '__self__') return String(r.StaffEmail||'').toLowerCase() === session.Email.toLowerCase();
        if (person === '__all__') return true;
        return r.StaffName === person;
      }).sort((a,b) => new Date(a.ExpenseDate||a.Timestamp) - new Date(b.ExpenseDate||b.Timestamp));
    }


    function render() {
      const ld = document.getElementById('loading');
      ld.classList.remove('loading');
      ld.style.display = 'none';
      const c = document.getElementById('content');
      c.style.display = 'block';

      const items = getFiltered();
      const total = items.reduce((s,r) => s + (Number(r.Amount)||0), 0);
      const approved = items.filter(r => r.Status === 'Approved');
      const pending = items.filter(r => r.Status === 'Pending');
      const rejected = items.filter(r => r.Status === 'Rejected');

      // by category
      const byCat = {};
      items.forEach(r => {
        const k = r.Category || 'OTHER';
        if (!byCat[k]) byCat[k] = { cat:k, amt:0, cnt:0 };
        byCat[k].amt += Number(r.Amount)||0; byCat[k].cnt++;
      });
      const cats = Object.values(byCat).sort((a,b) => b.amt - a.amt);
      const catMax = Math.max(...cats.map(x => x.amt), 1);

      // by person (for grouped table)
      const pSel = document.getElementById('fPerson');
      const groupByPerson = pSel && pSel.value === '__all__';

      const mName = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'][parseInt(document.getElementById('fMonth').value)-1];
      const scopeLbl = pSel && pSel.value === '__all__' ? 'ทุกคนที่ดูแล' : (pSel && pSel.value !== '__self__' ? pSel.value : (raw.myName || 'ตัวเอง'));

      let html = `
        <div class="count-hero">
          <div class="lbl">${scopeLbl} · ${mName} ${document.getElementById('fYear').value}</div>
          <div class="num">${Math.round(total).toLocaleString()}</div>
          <div class="sub">THB • ${items.length} รายการ</div>
        </div>
        <div class="kpi-grid">
          <div class="kpi ok"><div class="n">${approved.length}</div><div class="l">อนุมัติแล้ว</div></div>
          <div class="kpi warn"><div class="n">${pending.length}</div><div class="l">รออนุมัติ</div></div>
          <div class="kpi"><div class="n">${Math.round(approved.reduce((s,r)=>s+(Number(r.Amount)||0),0)).toLocaleString()}</div><div class="l">อนุมัติ (THB)</div></div>
          <div class="kpi ${rejected.length ? 'bad' : ''}"><div class="n">${Math.round(pending.reduce((s,r)=>s+(Number(r.Amount)||0),0)).toLocaleString()}</div><div class="l">รออนุมัติ (THB)</div></div>
        </div>`;

      // Category chart
      if (cats.length) {
        html += `<div class="card">
          <div class="card-head"><span class="ib ib-orange">📊</span>
            <div><div class="ch-title">แยกตามประเภท</div><div class="ch-sub">${cats.length} ประเภท</div></div></div>
          <div style="margin-top:14px;">
          ${cats.map(x => `<div class="bar-row">
            <span class="bl">${CAT_TH[x.cat]||x.cat}</span>
            <span class="bt"><span class="bf" style="width:${(x.amt/catMax*100).toFixed(0)}%;"></span></span>
            <span class="bv">${Math.round(x.amt).toLocaleString()}</span>
          </div>`).join('')}
          </div>
        </div>`;
      }

      // ═══ Excel-style preview table ═══
      lastItems = items;
      lastGroupBy = groupByPerson;
      lastSub = `${scopeLbl} · ${mName} ${document.getElementById('fYear').value} · ${items.length} รายการ`;

      html += `<div class="card">
        <div class="card-head"><span class="ib ib-blue">📋</span>
          <div><div class="ch-title">Preview ข้อมูล (แบบ Excel)</div>
          <div class="ch-sub">${items.length} รายการ</div></div></div>
        <div style="margin-top:14px;">
          ${items.length === 0 ? '' : `<div class="tbl-bar">
            <span style="font-size:11.5px;color:var(--gray-500);">เลื่อนซ้าย–ขวาเพื่อดูคอลัมน์เพิ่ม</span>
            <span class="spacer"></span>
            <button onclick="openFs()">⛶ ดูเต็มจอ</button>
          </div>`}
          ${items.length === 0 ? '<div class="empty" style="padding:28px 12px;"><div class="icon-wrap">📭</div><div class="title">ไม่มีข้อมูลในเดือนนี้</div></div>' : renderTable(items, groupByPerson)}
        </div>
      </div>`;

      c.innerHTML = html;
    }

    // ── ดูเต็มจอ ──
    function openFs() {
      document.getElementById('fsSub').textContent = lastSub;
      document.getElementById('fsBody').innerHTML = renderTable(lastItems, lastGroupBy);
      document.getElementById('fsOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeFs() {
      document.getElementById('fsOverlay').classList.remove('show');
      document.body.style.overflow = '';
    }
    window.openFs = openFs; window.closeFs = closeFs;
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFs(); });

    function renderTable(items, groupByPerson) {
      const cell = v => v ? Math.round(v).toLocaleString() : '';
      const amtIf = (r, ok) => ok ? cell(Number(r.Amount)||0) : '';

      // นิยามคอลัมน์ — always:true = โชว์เสมอ ถึงจะว่างก็ตาม
      const COLS = [
        { k:'no',    label:'No.',        cls:'ctr', always:true,  get:(r,n) => n },
        { k:'date',  label:'วันที่',      cls:'ctr', always:true,  get:r => r.ExpenseDate ? new Date(r.ExpenseDate).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : '-' },
        { k:'cat',   label:'ประเภท',      cls:'ctr', always:true,  get:r => CAT_TH[r.Category] || r.Category },
        { k:'cust',  label:'Customer',    cls:'',    get:r => r.Customer || '' },
        { k:'ctc',   label:'Contact',     cls:'',    get:r => r.CustomerContact || '' },
        { k:'dist',  label:'Distance',    cls:'num', get:r => r.Category==='FUEL' ? (Number(r.Mileage_KM)||'') : '' },
        { k:'mile',  label:'Mile ฿',      cls:'num', get:r => amtIf(r, r.Category==='FUEL') },
        { k:'exp',   label:'Express ฿',   cls:'num', get:r => amtIf(r, r.Category==='EXPRESS') },
        { k:'ent',   label:'Ent ฿',       cls:'num', get:r => amtIf(r, r.Category==='ENT' || r.Category==='GOLF') },
        { k:'job',   label:'Job',         cls:'sm',  get:r => {
            if (['TRAVEL','OTHER','CAR','MOBILE','OVERSEAS','APT'].indexOf(r.Category) < 0) return '';
            const base = (r.Origin && r.Destination) ? r.Origin + '→' + r.Destination
                       : (r.Occasion || r.Venue || CAT_TH[r.Category] || r.Category);
            return base + ' ' + Math.round(Number(r.Amount)||0).toLocaleString();
          }},
        { k:'hotel', label:'Hotel ฿',     cls:'num', get:r => amtIf(r, r.Category==='HOTEL') },
        { k:'park',  label:'Park ฿',      cls:'num', get:r => amtIf(r, r.Category==='PARK') },
        { k:'rmk',   label:'Remark',      cls:'sm',  get:r => r.Venue || '' },
        { k:'st',    label:'Status',      cls:'ctr', always:true,  get:r => {
            const c = r.Status==='Approved' ? '#16A34A' : r.Status==='Rejected' ? '#DC2626' : '#F59E0B';
            return '<span style="color:' + c + ';font-weight:800;font-size:10.5px;">' + (r.Status||'-') + '</span>';
          }}
      ];

      const cols = COLS;   // โชว์ครบทุกคอลัมน์เสมอ

      const th = '<tr>' + cols.map(c =>
        '<th class="' + (c.cls === 'num' ? 'num' : c.cls === 'ctr' ? 'ctr' : '') + '">' + c.label + '</th>').join('') + '</tr>';

      const rowHtml = (r, n) => '<tr>' + cols.map(c =>
        '<td class="' + c.cls + '">' + (c.get(r, n) || '') + '</td>').join('') + '</tr>';

      let body = '';
      if (groupByPerson) {
        const groups = {};
        items.forEach(r => { const k = r.StaffName || '?'; (groups[k] = groups[k] || []).push(r); });
        Object.keys(groups).forEach(name => {
          const rows = groups[name];
          const sub = rows.reduce((s,r) => s + (Number(r.Amount)||0), 0);
          body += '<tr class="person-hdr"><td colspan="' + cols.length + '">👤 ' + name +
                  ' — ' + rows.length + ' รายการ — ' + Math.round(sub).toLocaleString() + ' THB</td></tr>';
          rows.forEach((r,i) => body += rowHtml(r, i+1));
        });
      } else {
        items.forEach((r,i) => body += rowHtml(r, i+1));
      }

      // ── แถวรวม: รวมยอดใต้คอลัมน์เงินของมันเอง ──
      const grand = items.reduce((s,r) => s + (Number(r.Amount)||0), 0);
      const sumOf = k => {
        const col = COLS.filter(c => c.k === k)[0];
        return items.reduce((s,r) => {
          const v = String(col.get(r, 0) || '').replace(/,/g, '');
          return s + (parseFloat(v) || 0);
        }, 0);
      };
      const MONEY = ['dist','mile','exp','ent','hotel','park'];
      let foot = '<tr>';
      cols.forEach((c, i) => {
        if (i === 0) { foot += '<td class="ctr">Σ</td>'; return; }
        if (MONEY.indexOf(c.k) >= 0) {
          const v = sumOf(c.k);
          foot += '<td class="num">' + (v ? Math.round(v).toLocaleString() : '') + '</td>';
          return;
        }
        if (c.k === 'cat') { foot += '<td class="ctr">รวมทั้งหมด</td>'; return; }
        if (c.k === 'st')  { foot += '<td class="ctr" style="color:#B7081D;white-space:nowrap;">' + Math.round(grand).toLocaleString() + ' ฿</td>'; return; }
        foot += '<td></td>';
      });
      foot += '</tr>';

      return '<div class="xl-wrap"><table class="xl"><thead>' + th + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>';
    }

    window.setStatus = setStatus;
    if (session) { load(); renderBottomNav('summary'); }
  </script>
</body>
</html>
